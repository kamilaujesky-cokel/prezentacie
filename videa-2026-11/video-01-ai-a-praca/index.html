<script>
const D = {"labels": ["Titulka", "Najviac zasiahnuté práce", "Krajný scenár", "200 hodín", "Poďme zistiť pravdu", "Človek proti robotom", "81 % a 0,3 %", "Humanoidy proti ramenám", "Ľudia za počítačom", "Graf Anthropic", "Čo ukazujú merania", "Dánsko", "Slovensko podľa krajov", "100 Slovákov podľa OpenAI", "Vysokoškoláci NBS", "Automobilová veľmoc", "Roboty na Slovensku", "Citát ZAP", "Zo 100 firiem", "60 ľudí", "Univerzálny príjem", "Altman, Musk a Anthropic", "Marienthal", "Garantovaná práca", "OpenResearch", "Nikto to nevie zmerať", "Dáta nemáme", "Satya Nadella", "Neboj sa, ale nespi", "Čo s tým", "Prompty z PDF", "Klub a Masterclass"], "notes": ["Hovoríš: Hook, prvé sekundy. Tieto práce AI zoberie ako prvé. A možno aj tú tvoju. Či áno, alebo nie, zistíš v tomto videu. Prejdeme všetko, čo dnes o AI a práci naozaj vieme, a na konci ti poviem, čo by som na tvojom mieste robil ja. Grafika: Videoprezentácia, oblúk: šok na začiatku, potom postupne odhaľujeme dáta, na konci zistíme, že dáta, ktoré by to potvrdili alebo vyvrátili, zatiaľ nie sú, upokojíme a pošleme ľudí vzdelávať sa. Titulka z IAMCP decku (editoriálna fotka), na YouTube ju nahradí miniatúra.", "Hovoríš: Anthropic, firma, ktorá robí Claude, v septembri spočítala, koľko práce v USA dokáže zasiahnuť AI spolu s robotmi. Kancelária a administratíva: takmer 100 percent úloh. Doprava a sťahovanie: okolo 90 percent. Z 10 najohrozenejších povolaní je 9 vodičov. A celkovo 81 percent všetkej práce. Ak sedíš za počítačom, si na prvom mieste. Grafika: Pruhy, kancelária zvýraznená (takmer 100 %, na slide ako 99 % len kvôli šírke pruhu, hovor takmer 100). Zdroj overený 22. 11. 2026: anthropic.com/research/what-work-can-robots-do, Figure 6: transportation & moving pod 15 % len s LLM, asi 90 % s robotmi; office & admin support takmer 100 %; celkovo asi polovica s LLM, 81 % s robotmi; 9 z 10 najexponovanejších povolaní sú vodiči (Figure 4). Zasiahnuté znamená, že technológia zvládne časť úloh, nie že miesto zanikne. To odhalíme až neskôr, v hooku to zámerne nehovoríme.", "Hovoríš: Anthropic ukázal tri scenáre, ako môže AI zmeniť ekonomiku USA do roku 2030. V tom najhoršom pre kancelárie: 13,5 percenta znalostných pracovníkov sa musí presunúť z práce za počítačom inam. (Klik.) Mzdy v kancelárii sú o 11,5 percenta nižšie, mimo kancelárie o 33,6 percenta vyššie, než by boli bez AI. Sami píšu, že to nie je predpoveď. A na Slovensko to nikto nepočítal, všetko sú dáta z USA. Grafika: Veľké číslo 13,5 %, na klik dve mzdy (1 krok). Zdroj: anthropic.com/institute/econ-scenarios, september 2026, model postavený na odpovediach 10 980 Američanov (august 2026). Znalostní pracovníci tvoria 62,2 % pracujúcich, z nich je v Extreme scenári 13,5 % vytlačených (Coklov dokument Tri scenáre). Pozor: v pôvodnom texte máš 14 % a 12 %, presne je to 13,5 % a 11,5 %.", "Hovoríš: Videli sme videá, ako roboti odrobia celú smenu. Americká firma Figure v máji spustila livestream: humanoidné roboty triedili balíky na páse, robot nájde čiarový kód, zdvihne balík a položí ho kódom nadol. Plán bol 8 hodín, teda jedna smena, a sami písali, že sa asi niečo pokazí. (Klik.) Po 8 hodinách sa nič nepokazilo, tak to nechali bežať ďalej. Skončili po 200 hodinách, to je viac ako 8 dní nonstop, a podľa firmy bez jediného zlyhania. Nepracoval jeden robot 200 hodín. Roboty sa striedali: keď sa jednému minie batéria, a vydrží 3 až 4 hodiny, sám si zavolá náhradu a ide sa nabiť. Firma tvrdí, že ich nikto neovládal na diaľku, nezávisle to overené nie je. A Xiaomi 3. novembra ukázalo dva humanoidy, ktoré odrobili 8 hodín v továrni na elektroautá. Je to koniec manuálnej práce? Grafika: Na klik sa 8 hodín prečiarkne, príde 200 hodín a vysvetlenie (1 krok). Fakty z postov CEO Figure Bretta Adcocka na X: štart 13. 5. 2026 (plán 8 hodín, „High odds something breaks“), 14. 5. po 8 hodinách pokračujú nonstop, 22. 5. „ran for 200 hours without a failure“; striedanie robotov a batéria 3 až 4 hodiny podľa postov z 13. 5. a 15. 5.; demo vo vlastnej hale Figure v Sunnyvale, nie u zákazníka. Číslo okolo 250 000 balíkov uvádzajú len médiá, preto ho nepoužívam. V strihu pod tým B roll z livestreamu Figure (video z konca maratónu na X CEO Figure) a oficiálne video Xiaomi (x.com/XiaomiTech_/status/2117542298238222588, 3. 11. 2026). Zdroje: research roboti a automotive, 1.1 a 1.2. Figure tvrdí, že roboty nikto neovládal na diaľku, nezávisle to overené nie je. Xiaomi nezverejnilo úspešnosť ani zásahy ľudí.", "Hovoríš: Znie to strašidelne. Kancelária takmer na sto percent, roboty, čo robia nonstop. Tak sa poďme pozrieť, čo z toho je pravda. Pekne po jednom. Grafika: Lime predel medzi hookom a odhaľovaním. Odtiaľto každý blok odhalí jednu vec, ktorá strach zmenší alebo spresní.", "Hovoríš: Ale pozri sa na toto. Figure dal 17. mája súťaž: stážista proti robotom, 10 hodín triedenia balíkov. (Klik.) Vyhral človek o 192 balíkov, a to mal obedňajšiu aj platené prestávky. Realita je zatiaľ iná, ako vyzerajú videá. Grafika: Dve veľké čísla, na klik veta Vyhral človek (1 krok). Zdroj: Figure AI, 17. 5. 2026, stážista 12 924 balíkov (2,79 s na balík), roboty 12 732 (2,83 s); robotov bolo viac a striedali sa (research 1.1).", "Hovoríš: Anthropic v septembri spočítal, na koľko práce v USA dosiahne AI spolu s robotmi. Je to 81 percent pracovného času. Nie je to počet miest, ktoré zaniknú, len práca, na ktorú technológia technicky dosiahne. (Klik.) Ale lacnejší ako človek je robot dnes len pri 0,3 percentách práce. Vie to, ale ešte sa to neoplatí. Grafika: Mriežka 100 bodiek: 81 svieti lime, na klik zhasnú všetky a ostane len kúsok jednej bodky (0,3), vľavo sa vymení číslo (1 krok). Zdroj: anthropic.com/research/what-work-can-robots-do (podľa Coklovho dokumentu Roboty a 81 %). Základ: pracovný čas v USA.", "Hovoríš: A koľko takých humanoidov reálne pracuje? Za celý minulý rok sa ich na svete predalo okolo 7 000. Klasických robotických ramien do fabrík pribudlo vyše 600 000. Na jedného humanoida je to zhruba 85 obyčajných robotov. Medzinárodná federácia robotiky píše, že humanoidy ešte len prechádzajú z laboratórií do pilotov. Grafika: Dve veľké čísla na krémovom slide. Zdroj: IFR, World Robotics 2026, zverejnené 24. 9. 2026, dáta za rok 2025 (research 1.7). Pomer 1 : 85 je výpočet z čísel IFR.", "Hovoríš: Dobre, roboti to zatiaľ nie sú. Ale pamätáš si tých takmer 100 percent v kancelárii? Ľudia za počítačom vraj sú nahraditeľní hneď, lebo AI nepotrebuje ruky. Koľko z nich to prežije? Grafika: Jedna veľká otázka na tmavom slide, bez ilustrácie. Prechod od robotov ku kancelárii.", "Hovoríš: Toto je graf od Anthropicu, firmy, ktorá robí Claude, z marca 2026. Zelená plocha ukazuje, koľko úloh v jednotlivých profesiách by AI teoreticky zvládla. Červená, koľko ich reálne robí. V IT a matematike by AI teoreticky zvládla 94 percent úloh, reálne ich robí 33. V administratíve je to podobne. Kancelária je na grafe najviac zasiahnutá. Grafika: Tvoj preložený radarový graf (Knižnica prezentácií, 2026_10_ako_na_ai_kros_slovnaft/graf_anthropic_radar.png, Slovnaft slide 2). Údaje: Anthropic, Labor market impacts of AI: A new measure and early evidence, 5. 3. 2026 (teoretické pokrytie podľa Eloundou a kol., reálne využitie podľa práce s Claude).", "Hovoríš: A čo hovoria merania, nie odhady? Ľudia na zákazníckej podpore s AI vybavili o 15 percent viac prípadov za hodinu. Najviac pomohla nováčikom. (Klik.) Ale skúseným programátorom trvala práca s AI o 19 percent dlhšie. A pritom mali pocit, že ich zrýchlila. Takže si to vo svojej práci zmeraj, nespoliehaj sa na dojem. Grafika: Dve karty, programátori na klik (1 krok). Zdroje: GenerativeAIatWork (QJE, 5 172 ľudí, zverejnené 4. 2. 2025); METR 10. 7. 2025, 16 programátorov, 246 úloh. METR 24. 2. 2026 doplnil, že pri opakovaní už niektorí programátori odmietali pracovať bez AI, takže 19 % nehovorí, ako je to dnes. Obe štúdie si označil zelenou, sú z roku 2025.", "Hovoríš: A teraz najväčší dátový pokus, aký máme. V Dánsku vedia o každom pracujúcom, koľko zarába a koľko hodín robí. Ekonómovia porovnali ľudí, ktorí četboty používajú, s tými, čo nie. Dva roky po príchode ChatGPT nenašli žiadnu merateľnú zmenu v zárobkoch ani v odpracovaných hodinách. Zmenila sa náplň práce, ľuďom napríklad pribudla kontrola toho, čo AI vyrobí. Výplatná páska zatiaľ nie. Grafika: Jeden veľký výrok. Zdroj podľa Coklovho dokumentu Video 01: Anders Humlum a Emilie Vestergaard, Large Language Models, Small Labor Market Effects, NBER w33777, upravená verzia marec 2026 (nber.org/papers/w33777). Dáta sú z rokov 2023 a 2024, preto pozor: odvtedy sú modely oveľa silnejšie.", "Hovoríš: A teraz Slovensko. OECD v novembri spočítala, koľko ľudí pracuje v povolaniach, kde by sa s AI dala viac ako polovica úloh spraviť za polovicu času. V Bratislavskom kraji sú to asi dvaja z troch. Inde na Slovensku menej ako jeden z dvoch. Pozor, je to zrýchlenie úloh, nie výpoveď. Je to odhad, nie úspora, ktorú už ľudia dosiahli. Grafika: Vodorovné pruhy, Bratislavský kraj zvýraznený lime. Zdroj: OECD Regions and Cities at a Glance 2026 (4. 11. 2026), Figure 1.8, stat.link/8ouh39 (overené v tabuľke 22. 11. 2026). Štruktúra povolaní z roku 2024, zasiahnutosť povolaní podľa Eloundou a kol. (2024). Rok 2024 na slide netreba (tvoj komentár v dokumente).", "Hovoríš: Iný pohľad. OpenAI rozdelilo pracujúcich na Slovensku do štyroch skupín. U 26 zo 100 AI zmení, ako pracujú, ale prácu im nevezme. U 11 môže dopyt po ich práci dokonca narásť. Ohrozených je 13 zo 100, to sú tí, ktorých prácu môže AI nahradiť. A u polovice sa zatiaľ zmení málo. (Klik.) V Česku je ohrozených 11 zo 100, v celej EÚ 14. Takže sme presne v priemere. Treba povedať, že tento odhad spravila firma, ktorá AI predáva. Európska komisia ho v októbri prevzala. Grafika: Mriežka 100 bodiek v štyroch farbách, na klik porovnanie so Českom a EÚ (1 krok). Zdroj: OpenAI Economic Research, The AI jobs transition framework for the EU, 29. 6. 2026, údaje Eurostatu za rok 2025, pracujúci 15 až 74 rokov; Európska komisia prevzala 12. 10. 2026.", "Hovoríš: A jedno číslo, ktoré ma prekvapilo. Národná banka Slovenska porovnala vysokoškolákov. Na Slovensku robí 44 percent z nich prácu s potenciálom automatizácie, v Česku len 26. Prácu, ktorú AI skôr doplní, robí u nás 30 percent, v Česku 55. Naši vysokoškoláci robia viac rutinnej digitálnej práce. To je pre nás varovanie. Grafika: Dve dvojice pruhov. Zdroj: NBS, 2. 11. 2026, prieskum zručností PIAAC 2023 (nbs.sk/dokument/ce613fe0-56ce-4174-a33d-e98426879296). NBS sledovala každodenné digitálne úlohy a samostatnosť, nie to, či niekoho nahradili. Pozor: prieskum PIAAC je z roku 2023, analýza NBS z novembra 2026.", "Hovoríš: Slovensko je automobilová veľmoc. Minulý rok sme vyrobili 1,07 milióna áut, takmer 196 na tisíc obyvateľov, najviac na svete. Autopriemysel je viac ako polovica priemyselnej výroby a 42,6 percenta exportu. Priamo aj nepriamo z neho žije vyše 256 000 ľudí. Čo sa stane, keď to celé nahradia roboti? Grafika: Tri čísla. Zdroj: tlačová správa ZAP SR 13. 1. 2026 (zapsr.sk), research automotive 2.1. ZAP nerozdeľuje priame a nepriame miesta.", "Hovoríš: Prekvapenie. Krajina, ktorá vyrába najviac áut na obyvateľa, má robotov menej ako priemer EÚ aj ako Česko. 210 robotov na 10 000 zamestnancov vo výrobe, Nemecko 469. Karosárne sú plne robotické, ale montáž a logistika sú stále veľmi ručné. A presne tam mieria humanoidy. Na Slovensku zatiaľ žiadna automobilka humanoida nemá. Volvo pri Košiciach spúšťa 600 klasických robotov a Mercedes v maďarskom Kecskeméte už skúša humanoida s AI od Googlu. Grafika: Pruhy, Slovensko zvýraznené. Zdroj: IFR tlačová správa World Robotics 2026 (12. 11. 2026), hodnota pre Slovensko a poradie odčítané z grafu IFR (research 2.2). Volvo a Mercedes: research 2.3 a 1.4. Výklad o montáži a logistike je interpretácia, nie údaj IFR.", "Hovoríš: A toto povedal v januári sám prezident Zväzu automobilového priemyslu. Zamestnanosť klesá, lebo vyrábame efektívnejšie. Automatizácia teda už prebieha, len potichu, nie humanoidmi. Väčšie riziko pre nás sú dnes modely áut, ktoré sa prideľujú iným krajinám. Grafika: Citát na lime. Zdroj: TASR z tlačovej konferencie ZAP 13. 1. 2026 (teraz.sk), v oficiálnej tlačovej správe ZAP citát nie je (research 2.1). Prehraté modely: ZAP 30. 1. 2026.", "Hovoríš: A ako dôkaz, ako pomaly to ide: zo 100 slovenských firiem používa AI 18. (Klik.) Len 9 z nich ju má na konkrétnom procese, ako marketing alebo financie. (Klik.) A len 2 aspoň na troch procesoch. Grafika: Slide z IAMCP a HR Next, 100 bodiek a čísla na klik (3 kroky). Zdroj: Eurostat isoc_eb_ai, využívanie IKT vo firmách 2025 (18,00 %, 9,46 %, 2,35 %), overené 11. 11. 2026.", "Hovoríš: Na workshopoch hovorím, že AI ľudí nenahradí. A raz za mnou po workshope prišla žena a povedala mi, že ich americká firma prepustila na Slovensku celý tím, 60 ľudí. [doplniť: kedy a kde to bolo, čo ten tím robil, čo si jej povedal a čo si z toho odniesol.] Grafika: Jedno veľké číslo. Tvoj osobný príbeh z dokumentu Video 01, detaily doplň. Prípadne bez slidu, len kamera na teba.", "Hovoríš: Keď sa hovorí o tom, že AI zoberie prácu, skoro vždy príde odpoveď: tak ľuďom budeme posielať peniaze. Univerzálny základný príjem. Môj názor: je to blbosť. A poviem ti prečo. Grafika: Otázka na celý slide, bez ilustrácie.", "Hovoríš: Aj tí, čo AI stavajú, sa nezhodnú. Sam Altman, ktorý univerzálny príjem roky propagoval, v apríli povedal, že už mu neverí tak ako kedysi. OpenAI namiesto toho navrhuje verejný fond bohatstva. (Klik.) Elon Musk naopak sľubuje univerzálny vysoký príjem, šeky od štátu. (Klik.) A Anthropic, firma, ktorá robí Claude, to chce platiť z vlastného podielu vo firme. V októbri dal 5 percent svojich akcií do nového fondu a za každých 50 percent rastu hodnoty firmy môže pribudnúť ďalšie 2 percentá. Fond môže dávať peniaze neziskovkám alebo priamo skupinám ľudí, a ako príklad uvádzajú práve ľudí, ktorých AI vytlačí z práce. Spolu so sľubmi zakladateľov, ktorí dajú 80 percent svojich akcií na dobročinnosť, chce Anthropic venovať verejnému dobru zhruba pätinu firmy. Už v júni navrhli, aby každý mal účet s podielom na raste ekonomiky, financovaný aj akciami AI firiem, a ako prví ho mali dostať ľudia v profesiách, ktoré AI ohrozuje najviac. Kto presne a kedy peniaze dostane, zatiaľ nepovedali. Grafika: Tri karty na klik (2 kroky), Anthropic lime. Zdroje: Altman, podcast The Atlantic, 29. 4. 2026, okolo 24:30; Musk, post na X 17. 4. 2026 (research UBI, úloha 3). Anthropic: anthropic.com/news/public-benefit-fund (18. 10. 2026, overené 22. 11. 2026): 5 % akcií, ďalšie 2 % za každých 50 % rastu hodnoty nad základňou podľa rozhodnutia boardu, podlieha schváleniu akcionárov, LLC, „direct distributions to specific populations“, príklad labor market impacts, spolu asi 20 % akcií na verejné dobro (vrátane 80 % akcií zakladateľov a zamestnaneckého programu). Anthropic Economic Policy Framework, jún 2026: pre-distributive capital accounts s prioritou pre pracovníkov v profesiách najviac vystavených AI, financovanie aj akciami AI firiem; sami píšu, že to nerieši rýchlu stratu práce. Kto dostane peniaze a kedy, Anthropic zatiaľ nezverejnil.", "Hovoríš: Pri Viedni bola obec Marienthal. Celá žila z jednej textilky a tú v roku 1930 zavreli. Sociológovia tam rok sledovali, čo sa s ľuďmi stane. Z 367 rodín bez práce 70 percent rezignovalo. (Klik.) Muži chodili po ulici pomalšie ako ženy, merali to stopkami. A 88 zo 100 prestalo nosiť hodinky, lebo čas pre nich prestal mať význam. Nezlomila ich len chudoba. Stratili zmysel a štruktúru dňa. Grafika: Tri čísla a na klik detail s hodinkami (1 krok). Fakty: research UBI a Marienthal, úloha 1 (Rakúsko, Gramatneusiedl, výskum november 1931 až máj 1932, kniha 1933). POZOR: nebolo to vo Francúzsku a ľudia nedostávali základný príjem, len nízku dočasnú podporu v nezamestnanosti, polovica ani tú. Viac peňazí znamenalo menej apatie, nie viac. Preto nehovor, že zlenivili z peňazí. Historická fotka obce: [doplniť, over licenciu].", "Hovoríš: A teraz to najzaujímavejšie. V tej istej obci o 90 rokov neskôr skúsili opak. Rakúsky úrad práce tam od októbra 2020 do marca 2024 garantoval prácu každému, kto bol bez práce aspoň rok. Nikoho nenútili, ale každý, kto prešiel dvojmesačnou prípravou, ponuku prijal. Najprv im pomáhali nájsť bežnú prácu, ktorú štát prvé mesiace dotoval. Kto ju nenašiel, dostal miesto v novej sociálnej firme: starali sa o deti, záhrady, robili rekonštrukcie a stolárčinu, a mohli navrhovať vlastné projekty. Plat bol minimálna mzda podľa kolektívnej zmluvy, okolo 1 500 eur. Spolu prešlo programom 107 ľudí. Z 112 oprávnených našlo prácu 80: 45 v sociálnej firme a 35 na bežnom trhu práce. Ekonómovia z Oxfordu a Edinburghu to vyhodnotili ako experiment s náhodným výberom: ľuďom sa zlepšila finančná aj psychická pohoda, mali štruktúru dňa, kontakty a uznanie. Dlhodobá nezamestnanosť v obci klesla a nikomu inému prácu nezobrali. Stálo to 237 eur mesačne na človeka. Preto si myslím, že riešenie nie sú peniaze zadarmo, ale práca a nové zručnosti. Grafika: Lime slide s tromi číslami. Zdroj: Kasy a Lehner, Employing the unemployed of Marienthal: Evaluation of a guaranteed job program, verzia 15. 2. 2026, prijaté do AEJ: Economic Policy (lukaslehner.github.io/assets/Jobguarantee_marienthal.pdf, overené 22. 11. 2026). Program MAGMA (Modellprojekt Arbeitsplatzgarantie Marienthal), AMS Dolné Rakúsko, Gramatneusiedl, oprávnení: nezamestnaní 12 a viac mesiacov (alebo 9 až 12 mesiacov), 112 oprávnených, 107 účastníkov, 80 našlo prácu (45 v sociálnej firme it.works, 22 na trhu s dotáciou mzdy, 13 bez dotácie), rozpočet 7,4 mil. €, mzda okolo 1 500 € v 2020 (1 700 € v 2023), náklad 237 € na účastníka a mesiac, príjem účastníkov +102 € mesačne. Pozor: 80 ľudí s prácou je z 112 oprávnených, nie zo 107 účastníkov.", "Hovoríš: Aby som bol fér, druhá strana. Najväčší pokus s peniazmi bez podmienok v USA financoval Sam Altman. Bežal v Illinois a Texase od roku 2020 do 2023. 1 000 ľudí s nízkym príjmom dostávalo 1 000 dolárov mesačne tri roky, to je asi 910 eur. Kontrolná skupina, 2 000 ľudí, dostávala 50 dolárov. Výsledky vyšli v novembri v jednom z najprestížnejších ekonomických časopisov. Nezlenivili, ale pracovali o hodinu až dve týždenne menej a ich zárobok z práce klesol asi o 1 900 dolárov ročne. Pribudlo im najmä voľného času, lepšiu prácu si nenašli. Spokojnejší boli len prvý rok, potom sa vrátili na úroveň kontrolnej skupiny. Rodičia dali viac peňazí na deti, ale deťom sa v škole nedarilo lepšie. A minuli o 300 dolárov mesačne viac, no ich majetok sa takmer nezmenil. Peniaze teda prácu ani zmysel nenahradili. Grafika: Tri čísla. Zdroje (research UBI, úloha 2): OpenResearch Unconditional Income Study, QJE ročník 141, číslo 4, november 2026 (online 14. 8. 2026): príjem z práce nižší asi o 1 900 USD ročne, účasť na trhu práce nižšia o 4,2 p. b., o 1 až 2 h týždenne menej (aj partneri), najviac pribudol voľný čas, kvalita práce sa nezlepšila, spokojnosť vyššia len v 1. roku. Pracovný článok 26. 3. 2026 (deti): viac výdavkov na deti, výsledky detí bez zmeny. Pracovný článok 15. 9. 2026 (spotreba): výdavky aspoň +300 USD mesačne, čisté imanie takmer bez zmeny. Kontrolná skupina 2 000 ľudí, 50 USD mesačne. Altmanov príspevok 14 mil. USD je len z Business Insider, preto ho nehovorím.", "Hovoríš: Môj názor: je strašne ťažké to zmerať a nikto nemôže jednoznačne povedať, že AI zoberie prácu presne týmto ľuďom. (Klik.) Adopcia je v každej krajine iná. (Klik.) V každom odvetví iná. (Klik.) Do toho regulácia. (Klik.) A dôvera ľudí v AI. Je toho strašne veľa premenných. Grafika: Štyri riadky pribúdajú na klik (4 kroky). Tvoj názor z dokumentu Video 01.", "Hovoríš: A tu je pointa celého videa. Všetky tie strašidelné čísla zo začiatku sú odhady, čo by AI mohla zvládnuť. Nie merania toho, čo sa naozaj stalo. Na Slovensku už vieme, že s AI ľudia vedia niektoré úlohy zvládnuť rýchlejšie a lepšie: v Národnej banke im zadané úlohy trvali o 21 percent kratšie. A pár firiem jej pripisuje aj zmeny v počte ľudí, v prieskume PwC 8 percent riaditeľov uviedlo pokles a 5 percent rast. Čo ale nevieme, je to, či na celom Slovensku pre AI viac miest vzniká, alebo zaniká, a ako mení mzdy. To zatiaľ nikto nezmeral. Takže kto ti dnes povie, že AI zoberie prácu presne tebe, alebo že sa ťa to netýka, háda. Grafika: Lime slide, hlavné odhalenie. Overil Cokel 22. 11. 2026, verdikt: tvrdenie „nemáme dáta“ je čiastočne pravdivé, preto formulácia „nikto nezmeral, či berie, alebo pridáva“. Merania na SK: pokus NBS (101 zamestnancov, jún 2024, štúdia 8. 7. 2025: o 21 % menej času, kvalita o 33 až 44 % vyššia); PwC a Forbes CEO prieskum 2025 (130 riaditeľov, zber 11/2024 až 2/2025: za 12 mesiacov 8 % pokles počtu zamestnancov aspoň o 5 %, 5 % rast, 59 % bez zmeny, sú to odpovede riaditeľov, nie počty ľudí); AmCham centrá služieb 2026 (36 % nové miesta, 26 % vytlačenie niektorých, AI spolu s RPA). Chýba: meranie za celé Slovensko, ktoré by oddelilo vplyv AI na zamestnanosť, mzdy a produktivitu (ŠÚ SR, ÚPSVaR, Eurostat to nesledujú).", "Hovoríš: Tvoj zážitok zo San Francisca. Bol si na súkromnej diskusii so Satyom Nadellom, šéfom Microsoftu. Dostal otázku, či sa ešte oplatí študovať programovanie. Odpovedal, že áno, ale musí sa zmeniť spôsob, akým sa učíme. Nezáleží na tom, či kód napíše AI za teba. Záleží na tom, či rozumieš, čo spravila a prečo. Volal to cognitive coverage. A neplatí to len pre kód: cenová ponuka, analýza, mail klientovi. Ak to ide von pod tvojím menom a nerozumieš tomu, problém je tvoj, nie AI. [doplniť: kedy presne to bolo] Grafika: Tvoje dve fotky z Knižnice prezentácií (kamil_v_publiku.jpg, satya_nadella.jpg, Slovnaft slide 3), dole výrok. Príbeh podľa tvojho newslettra z júna 2026 (Stretol som šéfa Microsoftu, skill kamil-newsletter, príklad 05).", "Hovoríš: Takže nepanikár. Nikto nevie, či AI zoberie práve tvoju prácu, a dáta zatiaľ nehovoria, že sa to deje vo veľkom. Ale ani nespi. Kancelárska práca je podľa všetkých odhadov zasiahnutá najviac a mení sa každý mesiac. A ten, kto AI vie používať, má najväčšiu šancu, že to nebude on, koho nahradia. Grafika: Veľký výrok pred záverečnými radami. Upokojenie, ale s výzvou.", "Hovoríš: Takže čo s tým? (Klik.) Vzdelávaj sa. (Klik.) Sleduj, čo AI vie, lebo sa to mení každý mesiac. (Klik.) A hlavne si ju skúšaj vo svojej práci a zmeraj, s čím ti naozaj pomôže. Grafika: Tri riadky na klik (3 kroky). Odkaz pre diváka z tvojho dokumentu.", "Hovoríš: Ak nevieš, ako s AI v práci začať, skopíruj si tieto tri prompty. Hranaté zátvorky prepíš na svoju prácu. (Klik.) Prvý: AIčko sa správa ako AI konzultant, najprv sa ťa vypýta na tvoju prácu a potom ti navrhne 5 úloh, ktoré za teba môže robiť, aj s hotovými promptmi a odhadom ušetreného času. (Klik.) Druhý: kariérny poradca ti rozdelí tvoju prácu na to, čo AI zvládne už dnes, s čím ti pomôže a čo ostane na tebe. To je presne odpoveď na otázku z tohto videa, len pre teba. (Klik.) Tretí: osobný AI tréner ti spraví plán na 4 týždne, každý týždeň jednu úlohu z tvojej práce, a zmeriaš si, či ti to ušetrilo čas. Prompty nájdeš aj v popise videa. Grafika: Tri karty na klik (3 kroky). Prvý prompt je tvoj štartovací prompt z prednášok (OVB slide 89, Stomatologické dni slide 86, ZRKS slide 59, Kozmetický kongres slide 57), zovšeobecnený s hranatými zátvorkami namiesto odvetvia. Druhý a tretí sú nové, napísané rovnakým vzorom (rola, 5 otázok, výstup), v tvojich prezentáciách ani PDF neboli, skontroluj ich. Ak ich chceš dať do popisu videa, skopíruj ich odtiaľto.", "Hovoríš: A ak chceš vidieť, ako AI v práci používam ja, celý svoj systém ukazujem v Don't Die Busy Club aj v AI Masterclass. Odkaz je v popise. Grafika: Tmavý closing, lime pilulka a QR na kamilaujesky.com/klub. Ceny a čísla klubu na slide zámerne nie sú."]};
const fr = document.getElementById('deck');
let idx = 0, slideEl = null, obs = null;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const n = D.notes[idx] || '';
  let hov = n, gra = '';
  const gi = n.indexOf(' Grafika');
  if (gi >= 0){ hov = n.slice(0, gi); gra = n.slice(gi + 1); }
  let tag = '';
  hov = hov.replace(/NOV(Ý|É) SLIDE[^)]*\)\.?|NOVÝ SLIDE V TOMTO VIDEU \([^)]*\)\.?/g, m => { tag = m.replace(/\.$/,''); return ''; });
  hov = hov.replace(/Hovoríš:\s*/g, '').trim();
  const parts = hov.split(/\(Klik\.\)/);
  const step = slideEl ? +(slideEl.dataset.step || 0) : 0;
  let x = tag ? '<div class="tag">' + esc(tag) + '</div>' : '';
  parts.forEach((p, i) => { x += '<p data-i="' + i + '" class="' + (i === step ? 'cur' : '') + '">' + (i ? '<span class="klik">KLIK ' + i + '</span>' : '') + esc(p.trim()) + '</p>'; });
  if (gra) x += '<details id="gra"><summary>Grafika a zdroje</summary>' + esc(gra) + '</details>';
  document.getElementById('notes').innerHTML = x;
  document.getElementById('num').textContent = 'SLIDE ' + (idx + 1) + ' / ' + D.labels.length + (parts.length > 1 ? '   ·   krok ' + step + ' / ' + (parts.length - 1) : '');
  document.getElementById('lab').textContent = D.labels[idx];
  document.getElementById('next').innerHTML = idx + 1 < D.labels.length ? 'Ďalší slide: <b>' + esc(D.labels[idx + 1]) + '</b>' : 'Posledný slide';
  const c = document.querySelector('#notes p.cur'); if (c) c.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
fr.addEventListener('load', () => {
  const doc = fr.contentDocument, ds = doc.querySelector('deck-stage');
  const slides = [...doc.querySelectorAll('deck-stage > section')];
  function bind(i){
    idx = i; slideEl = slides[i];
    if (obs) obs.disconnect();
    obs = new MutationObserver(render); obs.observe(slideEl, {attributes: true, attributeFilter: ['data-step']});
    render();
  }
  ds.addEventListener('slidechange', e => bind(e.detail.index));
  const a = slides.findIndex(s => s.hasAttribute('data-deck-active'));
  bind(a >= 0 ? a : 0);
  fr.contentWindow.focus();
});
// kláves v pravom paneli pošli do decku
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageDown','PageUp',' ','Home','End'].includes(e.key)){
    e.preventDefault(); fr.contentWindow.focus();
    const ev = new fr.contentWindow.KeyboardEvent('keydown', {key: e.key, code: e.code, bubbles: true, cancelable: true});
    fr.contentDocument.dispatchEvent(ev);
  }
});
</script></body></html>
