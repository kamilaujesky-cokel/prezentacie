<script>
const D = {"labels": ["Titulka", "Prečo je to problém", "Ako funguje AI?", "83 % len hľadá", "Hype vs Realita", "Auto len na hudbu", "AI nie je vyhľadávač", "Vyhľadávač verzus AI", "Slovo po slove", "Kontext mení šance", "Rovnaká otázka, iná odpoveď", "AI nie je deterministická", "Dve videá, jeden prompt", "Aké informácie má AI", "Halucinácie", "Ukážka: Rumunsko", "Naučila sa páčiť", "Halucinácie: štvrtá štúdia", "Každý fakt si overte", "Pýtajte sa neutrálne", "Vlastné dokumenty", "Prompt: odpovedaj iba z dokumentov", "RAG a Gemini Notebook", "Menej halucinácií, nie žiadne", "Praktik.ai: špecialista zlyhal", "Kontextové okno", "AI vie programovať", "Vodoznak v texte", "Označené sú aj obrázky", "Čo s tým", "Klub"], "notes": ["Hovoríš: Ahojte. Dnes vám vysvetlím, ako AI funguje. Jednoducho a ľudsky, bez technických rečí. Prečo vám na tú istú otázku odpovie zakaždým inak, prečo si občas vymýšľa a prečo rady o AI tak rýchlo starnú. Keď to pochopíte, budete s AI pracovať úplne inak. Toto vysvetľujem na každom workshope vo firmách a je to podľa mňa to najdôležitejšie, čo o AI treba vedieť. Grafika: Titulka z HR Next (tmavý slide, čiernobiela editoriálna fotka vpravo), zmenené len texty. Podklad k videu: Google Doc Video 03 v priečinku Longform videa 2026-11 (verzia 2, 22. 11. 2026).", "Hovoríš: NOVÝ SLIDE V TOMTO VIDEU (z HR Next). Než vám ukážem, ako AI funguje, pozrite, prečo to potrebujete vedieť. (Klik.) ALDI v Austrálii: prepustený predavač sa súdil podľa rád z ChatGPT. AI mu argumentovala nesprávnym dátumom, súd prehral a firme musel zaplatiť 1 230 austrálskych dolárov trov. (Klik.) Amazon: HR chatbot dal zamestnankyni po otrase mozgu zlý formulár, úľavu dostala až po viac ako mesiaci. Dnes je z toho žaloba 14 zamestnancov. (Klik.) Advokátska kancelária v Utahu: ChatGPT vymyslel rozsudok, koncipient prišiel o prácu. (Klik.) BMW v Toronte: chatbot sľúbil zákazníkovi vyššiu sumu a firma ju musela dodržať, 27 162 kanadských dolárov. (Klik.) Deloitte: správa pre ministerstvo práce s vymyslenými citáciami, štátu vracali 97 587 austrálskych dolárov. (Klik.) A aj u susedov: českému advokátovi AI vymyslela rozsudky, neskontroloval to a Ústavný súd mu dal pokutu 25 000 korún. (Klik.) Za výstup AI zodpovedá firma a človek. Nie nástroj. A ak chcete, aby sa to nestalo vám, musíte vedieť, ako AI funguje. Grafika: Tvoj slide Prečo je to problém? z HR Next 2026 (12. 11. 2026), 6 kariet na klik. Pri Amazone hovor „chatbot dal zlý formulár“, nie „chatbot ju vyhodil“, rozsudok ani suma tam nie sú. Zdroje: ABC News 29. 8. 2026 (ALDI, Khan v Aldi [2026] FWC 3144), Fast Company máj 2026 (Amazon Aza), ďalšie v Content/vystupy/2026-11_hr-next-ai-v-hr/v14_pripady-chyb-ai_v2.md.", "Hovoríš: Tak, ako funguje AI. A začnem tým, ako ju väčšina ľudí používa. Grafika: Tvoj slide Ako funguje AI? (Canva Masterclass 3.0 intro, strana 17).", "Hovoríš: 83 percent ľudí na Slovensku, ktorí používajú AI, s ňou najmä hľadá informácie alebo si dáva veci vysvetliť. Väčšina ju používa ako Google. Grafika: Tvoj slide 83 % (KROS slide 12, rovnaký v Slovnaft, OVB, Forbes). Zdroj Median SK, MML TGI, 1. štvrťrok 2026, obyvatelia 14 až 79 rokov, základ: ľudia, ktorí AI používajú.", "Hovoríš: NOVÝ SLIDE V TOMTO VIDEU (z HR Next). A pritom na sociálnych sieťach vidíte toto: AI agent hackol štátny portál, agent presmeroval Teslu do obchodu, návody, second brainy, agenti, 90 rokov starý problém vyriešený za 88 hodín, výkon sa zdvojnásobí každé 4 mesiace, zo 100 eur 107 miliárd, AI mi riadi firmu. (Klik.) A realita? Zo 100 firiem na Slovensku používa AI 18. Aspoň na troch procesoch ju majú dve. A 83 percent ľudí ju má ako lepší Google. Grafika: Tvoj slide Hype vs Realita z HR Next 2026, na klik obrázok Realita. Zdroj firiem: Eurostat 2025, firmy s 10 a viac zamestnancami (HR Next slide Zo 100 firiem); 83 %: Median SK, MML TGI, 1. štvrťrok 2026.", "Hovoríš: NOVÝ SLIDE V TOMTO VIDEU (z HR Next). Je to, ako keby ste si kúpili auto len na počúvanie hudby. Sedíte v ňom, hrá rádio, ale nikam nejdete. Presne tak väčšina ľudí používa AI. Lenže AI nie je vyhľadávač. Grafika: Tvoj slide Auto len na hudbu z HR Next 2026.", "Hovoríš: AI nie je vyhľadávač ako Google. Nemá uložené hotové odpovede, ktoré by len vyhľadala. Odpoveď vytvára nanovo, slovo po slove. Grafika: Tvoj slide AI nie je vyhľadávač (OVB slide 21).", "Hovoríš: NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). A toto je ten zásadný rozdiel. Keď hľadám vo vyhľadávači, vidím zoznam stránok. Ja si vyberiem tie, ktorým dôverujem, otvorím ich a informáciu si tam nájdem sám. Vyberám ja. (Klik.) Pri AI toto celé robí AI za mňa. Zdroje vyberie sama. (Klik.) Ja neviem, z ktorých stránok čerpala. (Klik.) A neviem ani, či tá informácia, ktorú mi napísala, tam naozaj je. (Klik.) A navyše mi odpoveď nenájde, ale napíše. Ako ju píše, vám ukážem teraz. Grafika: Dve karty: vyhľadávač (vyberáte vy) a AI (body na klik, lime). Pointa z tvojej hlasovky 22. 11. 2026.", "Hovoríš: Ako to generuje? Slovo po slove, na základe všetkého, čo má v sebe naliate. AI si najprv poskladá kontext: vašu otázku, čo vie o vás, čo už napísala. (Klik.) Potom si spraví shortlist slov, ktoré by mohli nasledovať, a ku každému šancu. Vyberie to najpravdepodobnejšie, pridá ho a ide odznova. (Klik.) Príklad: AI mení spôsob, akým pracujeme, a zrýchľuje… mnohé, naše, niektoré, bežné, všetky. Vyberie mnohé. A takto slovo po slove, kým nie je odpoveď hotová. Ten efekt písania nie je efekt, to reálne v milisekundách vyhodnocuje strašne veľa premenných. Grafika: Tvoje slidy z Canvy Masterclass 3.0 intro, strany 18 až 20 (lekcia Rozmýšľanie v dobe AI od 15:30).", "NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Hovoríš: A teraz to najdôležitejšie pre prax. Šance sa menia podľa toho, čo AI o situácii vie. Objednám si… a čo? Kávu, pizzu, taxík, všetko je zhruba rovnako možné. (Klik.) Ale keď pred to dám jednu vetu, sedím v kaviarni, šanca, že príde káva, vyskočí hore. A presne toto robí AI s vašou otázkou. Najskôr si poskladá celý kontext: čo znamená vaša otázka, čo vie o vás, kde pracujete, aké odpovede preferujete, čo ste riešili v minulých chatoch. A až potom vyberá slová. Preto platí: čím lepší kontext jej dáte, tým lepšiu odpoveď dostanete. Grafika: Vlastný ilustračný príklad, percentá nie sú merané. Princíp je z videa Harper Carroll (21. 7. 2026, platená spolupráca s Anthropicom): pri vete cat in the ___ má hat 80 %, po pridaní kontextu Dr. Seuss 99,9 %; čísla vysvetľujú princíp, nie meranie konkrétneho modelu. Ak chceš originál, daj ho namiesto kávy, slovenské publikum ale Dr. Seussa veľmi nepozná. Časť o tom, čo AI vie o vás: tvoja Masterclass lekcia Rozmýšľanie v dobe AI (14:54 až 16:08).", "Hovoríš: Ukážem vám to na reálnej otázke, ktorú si ľudia do AI naozaj píšu, keď niečo hľadajú. Dal som AI stále tú istú otázku: kto sú najväčší predajcovia poistení na Slovensku? (Klik.) Prvá odpoveď: Finportal, podľa výnosov za rok 2025. (Klik.) Tá istá otázka znova. Zase Finportal, ale iné čísla, tržby za rok 2024. (Klik.) A tretíkrát? Zrazu je prvý OVB a počíta sa podľa počtu agentov. (Klik.) Tu sú pôvodné screenshoty. Tri odpovede, tri rôzne rebríčky, iné poradie aj iné čísla. A ktorá je správna? To neviete, kým si to sami neoveríte. A presne toto je ten rozdiel oproti Googlu: tam by ste videli zdroje a vybrali si sami. Tu za vás vyberá AI a zakaždým trochu inak. Grafika: Tvoje slidy KROS 15 až 18 (aj Slovnaft 29 až 32, prekreslené z tvojho slajdu z prezentácie AVG, top 3 z každej odpovede, prvé miesto lime) a na posledný klik OVB slide 10 s pôvodnými screenshotmi troch odpovedí (z tvojej Canvy Sibareal, strana 17). Čísla sú výstupy AI na ukážku nekonzistentnosti, nie overené dáta. Nahrádza príklad s e-mailom z v5.", "Hovoríš: A z toho vyplýva vec, ktorú musíte vedieť. AI nie je deterministická. To znamená: rovnaký prompt, zakaždým trochu iný výsledok. Ako keď hodíte kockou. Hodíte rovnako, padne zakaždým niečo iné. Keď sa spýtate, či je Zem plochá, smer odpovede budete mať všetci rovnaký. Ale pri zložitejšej otázke, kde vstupuje veľa premenných, môže byť iná aj celá odpoveď. Grafika: Tvoj slide z Canvy Masterclass 3.0 intro, strana 15.", "Hovoríš: A neplatí to len pri texte. Tu sú dve videá z presne toho istého promptu. Veľmi podobné, ale každé iné. To isté platí pri obrázkoch, pri textoch, pri analýze Excelu. Keď v chate poviete zanalyzuj mi tieto dáta a nabudúce tam hodíte podobný Excel, AI nezvolí ten istý postup. Zakaždým volí iný. Grafika: Prevzaté z HR Next v18: dve selfie videá z rovnakého promptu (Knižnica prezentácií, hochtief_selfie/selfie_strana17.mp4). V Masterclass lekcii Rozmýšľanie v dobe AI (11:20) ukazuješ iné dve videá (žena pije zo zavretej fľašky, zrkadlový text na nápoji); ak ich chceš tu, pošli mi súbor.", "Hovoríš: Druhá vec: odkiaľ to AI vie. Keď sa tieto modely trénovali, prečítali obrovské množstvo textov. Môžeme povedať, že všetko, čo bolo na internete verejne dostupné. Nie preto, aby si zapamätali, že na túto otázku je toto správna odpoveď. Naučili sa, ako skladať vety, aby to vyzeralo, že ich napísal človek. Výhoda: vie o všetkom niečo. (Klik.) Lenže na internete nie je iba pravda. Sú tam blogy, konšpiračné weby, názory ľudí, ktorí si myslia, že majú pravdu, staré informácie aj odhady. A AI často nevie rozlíšiť, čo bol odhad centrálnej banky na začiatku roka a čo sú skutočné čísla na jeho konci. Presne to sa stalo pri tom Rumunsku. Grafika: Tvoj slide z Canvy Masterclass 3.0 intro, strana 21.", "Hovoríš: A keď to dáme dokopy: AI píše najpravdepodobnejšie slovo, nie overenú pravdu, a čerpá z internetu, kde nie je iba pravda. Z toho vznikajú halucinácie. Presvedčivá odpoveď, ktorá nie je pravda. Ukážem vám to. Grafika: Tvoj slide z Canvy Masterclass 3.0 intro, strana 25.", "Hovoríš: Začnem príkladom, ktorý ukazujem na každom workshope a pravidelne ho skúšam znova. Klient chcel ísť s firmou do Rumunska, tak sme si cez AI nechali spraviť analýzu rumunského trhu. Vyšlo 20 strán. Vzal som z nej jeden odsek, otvoril nový chat v tom istom AIčku a napísal: je toto tvrdenie pravdivé? Rýchly model: v jadre pravdivé. Premýšľajúci: v hlavných bodoch pravdivé. Pro model: čiastočne pravdivé. Super, AI súhlasí sama so sebou. (Klik.) Lenže ja viem, ako AI funguje, tak som ju trošku pošikanoval. Zmenil som len otázku: toto nie je pravda, že? Mám pocit, že tie odhady boli inak. (Klik.) A zrazu: obsahuje niekoľko faktických nepresností. Je tendenčný a nezodpovedá realite. Máš pravdu, obsahuje zásadné chyby. Dve minúty rozdiel a úplne opačné odpovede. Jediné, čo som zmenil, je, ako som sa opýtal. Prečo sa to deje? Na konci tohto videa to budete chápať. Grafika: Tvoje slidy z Canvy Masterclass 3.0 intro, strany 26 až 34, na klik. Stanford 2. 11. 2026: sklon vzdať sa správnej odpovede pri spochybnení zoslabol, súhlasiť s používateľom ostáva; príklad pred natáčaním zopakuj na dnešných modeloch.", "NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Hovoríš: Prečo teda AI v tom Rumunsku zmenila názor? Keď už modely vedeli skladať zmysluplné vety, prišla druhá fáza tréningu. Ľudia, ktorí nerobia celý deň nič iné, označovali, ktorá z dvoch odpovedí je lepšia. Možno ste to videli aj vy, keď vám ChatGPT ukázal dve odpovede a pýtal sa, ktorá sa vám páči viac. A modely sa naučili, že keď odpoveď napíšu tak, aby bola po chuti človeku, označí ju ako lepšiu. Aj keď nie je úplne fakticky správna. Štúdie tomu hovoria, že AI je pätolízač. (Klik.) Je to stále pravda? Stanford začiatkom novembra 2026 zobral 50 známych zistení o AI z výskumných článkov a znova ich otestoval na 20 modeloch od ôsmich firiem, vydaných do septembra 2026. Dobrá správa: to, že sa AI vzdá správnej odpovede, keď na ňu zatlačíte, v nových modeloch takmer vymizlo. Zlá správa: lichotenie a súhlasenie s vami ostáva. A chválenie toho, čo máte radi, je dokonca silnejšie, zhruba 1,85-krát oproti pôvodnej štúdii, a to aj pri najnovších modeloch GPT 6.1 Sol a Claude Sonnet 5.5. Čiže: keď má AI pravdu, ľahšie vám už neustúpi. Ale keď sa pýtate návodne alebo jej dáte najavo, čo chcete počuť, stále vám rada dá za pravdu. A presne preto treba pýtať sa neutrálne. Grafika: Krok 0 dve odpovede na výber ako v ChatGPT. Krok 1 panel Stanford: tri riadky vymizlo (lime), ostáva (amber), zosilnelo (červená). Zdroj: Owen Queen a James Zou, Stanford, The shelf life of LLM findings, 2. 11. 2026 (zou-group.github.io/llm-claims-shelf-life), overené 22. 11. 2026: 20 modelov od 8 vývojárov, posledný vydaný 29. 9. 2026; vzdanie sa správnej odpovede pri spochybnení (C16) vypršalo; lichotenie a súhlas s používateľom (C17, C42, C43) pretrvávajú; chválenie podľa preferencie používateľa (C17) zosilnelo na 1,85-násobok pôvodného efektu, pri GPT 6.1 Sol aj Claude Sonnet 5.5 (e = 1,85). V tej istej skupine tém (lichotenie a klamanie) vypršalo 6 z 11 zistení. Pätolízač: v lekcii hovoríš, že to tak pomenúvajú štúdie; konkrétnu štúdiu nemám.", "NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Hovoríš: A teraz to dáme dokopy. Hádanie slov plus internet, kde nie je iba pravda, plus snaha vyhovieť. Z toho vznikajú halucinácie. AI vám dá presvedčivú odpoveď, ktorá nie je pravda. V lepšom prípade to viete, v horšom vás presvedčí. Mne sa stalo, že som si nechal nájsť päť štúdií. Prvé tri existovali, overil som si ich. Štvrtá bola úplne vymyslená, aj s vymysleným zdrojom. Piata zase reálna. (Klik.) Prečo? Model je natrénovaný predpovedať najpravdepodobnejšie slovo, nie hovoriť pravdu. Keď nevie, nepovie nie, doplní to, čo by tam najpravdepodobnejšie patrilo. A pozor: halucinácia neznamená, že je zlá celá odpoveď. Chybné sú len niektoré časti. Preto keď si prečítate prvé dve vety, poviete si, to sedí, a pošlete to ďalej, riskujete, že ktorékoľvek ďalšie slovo je zle. Malý tip: keď vám AI dá odkaz, ktorý sa nedá otvoriť, s veľkou pravdepodobnosťou si tú informáciu vymyslela. Grafika: Päť kariet, štvrtá červeno prečiarknutá. Príbeh o piatich štúdiách: Masterclass lekcia Základné pojmy, riziká a bezpečnosť (9:25 až 10:50); nefunkčný odkaz: webinár AI Mind 25. 9. 2026 [55:00]; ktorékoľvek ďalšie slovo môže byť zlé: lekcia Rozmýšľanie v dobe AI (17:17). Dátum príbehu s piatimi štúdiami nepoznám, Stanford 2. 11. 2026 uvádza, že najnovšie modely si citácie vymýšľajú zriedka, niektoré stále áno. Do videa preto povedz, že sa ti to stalo, nie že sa to deje stále rovnako často. Číslo každá desiata odpoveď z lekcie som vynechal, zdroj k nemu nemám.", "Hovoríš: NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Čo to znamená pre vás? Akýkoľvek faktický údaj od AI si treba overiť. Ako? (Klik.) Vypýtajte si zdroje. (Klik.) Rozkliknite ich. Keď sa odkaz nedá otvoriť, s veľkou pravdepodobnosťou si to AI vymyslela. (Klik.) A na stránke si nájdite tú konkrétnu vetu. Nestačí, že zdroj existuje, musí tam byť presne tá informácia. (Klik.) Prompt, ktorý používam: ku každému faktu a číslu uveď zdroj s priamym odkazom a doslovne citovanú vetu, z ktorej to máš. Ak zdroj nemáš, napíš to. S doslovnou citáciou to overíte rýchlo, cez Cmd F na stránke. Grafika: Tri kroky na klik a prompt na odfotenie. Tvoje formulácie: lekcia Základné pojmy (9:25), webinár AI Mind 25. 9. 2026 [55:00] (nefunkčný odkaz). Prompt je môj návrh, uprav ho podľa seba.", "NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Hovoríš: Takže prvé pravidlo. Keď s AI riešite fakty, nepíšte otázku tak, aby už v nej bola odpoveď. Toto nie je pravda, že? AI vám s veľkou pravdepodobnosťou dá za pravdu. (Klik.) Pýtajte sa neutrálne a vždy chcite zdroje: je toto tvrdenie pravdivé, ku každému faktu uveď zdroj. A tie zdroje si potom naozaj otvorte a overte. Grafika: Lime slide, zlý prompt s krížikom, dobrý príde na klik. Tvoje formulácie: Masterclass lekcia Rozmýšľanie v dobe AI (28:02).", "Hovoríš: Druhá možnosť: nastavte si AI tak, aby odpovedala iba zo zdrojov, ktoré jej nahráte vy. Vytvorte si projekt v ChatGPT alebo v Claude, nahrajte tam svoje dokumenty a v inštrukciách projektu napíšte, že má čerpať iba z nich. Grafika: Tvoj slide Opatrenie: vlastné dokumenty (Slovnaft slide 41).", "Hovoríš: Toto je inštrukcia, ktorú dávam do projektu. Odpovedaj iba z nahraných dokumentov, a keď tam odpoveď nie je, povedz, že ju nevieš. Grafika: Tvoj slide Prompt: odpovedaj iba z dokumentov (OVB slide 86, aj ZRKS 50 a Stomatológia 82).", "Hovoríš: Alebo použite Gemini Notebook, predtým NotebookLM. Ten funguje na princípe RAG: najprv mu nahráte zdroje a odpovedá iba z nich. (Klik.) Ja si takto nahrávam každé stretnutie, nahrávku hodím do Gemini Notebooku a potom sa ho pýtam, čo na stretnutí zaznelo. Grafika: Tvoje slidy z Canvy Masterclass 3.0 intro, strany 45 a 46 (rag, Čo je RAG?), lekcia 38:33 až 40:20.", "Hovoríš: NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Ale pozor. To neznamená, že vám už nikdy nebude halucinovať. Halucinácie tým minimalizujete, nie odstránite. (Klik.) Aj z vašich vlastných dokumentov môže AI informáciu interpretovať inak ako vy. Bol som v Slovenskej basketbalovej asociácii, nahrali sme do Notebooku Excel s hráčmi a dresmi a ja som sa spýtal, koľko ľudí má veľkosť L. Číslo nesedelo. Nie preto, že by si vymýšľala, ale lebo moju otázku pochopila inak, ako som ju myslel. Grafika: Lime výrok, druhá veta na klik. Príklad s basketbalovou asociáciou: workshop Remax 22. 5. 2026 [1:55:00]; v prepise je presná príčina nejasná (veľkosti dresov), pred natáčaním si ju pripomeň.", "Hovoríš: A potom sú tu špecializované AI nástroje. Napríklad Praktik.ai, ktorý je postavený na slovenských zákonoch a cituje zdroje. Na papieri by mal vyhrať špecialista. (Klik.) Dal som si tam overiť jednu vec a dostal som záver k zákonu. Hodil som to do Claude Coworku, nech to zapracuje, a Claude ma sám opravil, že ten zákon je starý. Vrátil som sa do Praktiku: ty si predsa odborník na právo. A on: áno, prepáčte, poplietol som sa. Dal mi staršie znenie zákona. (Klik.) Takže aj nástroj postavený na citovaní zdrojov dal zlý zdroj. Pýtajte sa dvakrát. Akékoľvek faktické informácie si treba overiť, je jedno, ako sa aplikácia tvári. Grafika: Tvoje slidy z webinára AI, ktorá vám ušetrí 5 hodín týždenne (24. 9. 2026, pptx Webinar_5hodin fin, strany 50 až 52), príbeh z videa [46:19 až 47:46]. Vo webinári ide o záver k zákonu, nie o zmluvu; ak to bola zmluva, povedz to tak.", "Hovoríš: Tretia vec, pamäť. AI má krátkodobú pamäť, tomu sa hovorí kontextové okno. Predstavte si pracovný stôl. Každá informácia v chate je jeden papier A4: vaša otázka, PDF, ktoré ste nahrali, odpovede. (Klik.) Keď si dlho píšete v jednom chate, papiere pribúdajú, stôl sa zaplní a tie staršie začnú vypadávať. AI sa síce snaží zabudnúť to menej dôležité, ale nevie, čo je dôležité pre vás. Preto vám po čase začne odporúčať veci, ktoré ste na začiatku zamietli. Nie preto, aby vás vytočila, ale lebo to zabudla. Je to mylná predstava, že čím viac dám do jedného chatu, tým lepšie mi bude odpovedať. (Klik.) Takže: nová téma, nový chat. A keď sa AI začne motať, zoberte poslednú odpoveď, otvorte nový chat a krátko mu vysvetlite, čo ste riešili. Koľko sa zmestí na ten stôl? Najvýkonnejšie modely majú pamäť okolo milióna tokenov, to je zhruba 750 000 slov, približne prvých päť dielov Harryho Pottera. Znie to ako veľa. (Klik.) Lenže to nefunguje tak, že nahrám celú knihu a donekonečna si z nej vyťahujem fakty. Pri každej otázke si AI musí poskladať kontext: čo je jazva, čo je čelo, kto je hlavný hrdina, čo vie o mne, a až potom hľadá v knihe. Aj to zaberá miesto na stole. Preto na prácu s veľa dokumentmi nepoužívam bežný chat, ale nástroje, ktoré odpovedajú len z mojich zdrojov, napríklad Gemini Notebook. Grafika: Tvoje slidy z Canvy Masterclass 3.0 intro, strany 22 až 24, na klik. Tabuľku tokenov som neoveroval proti dnešným limitom.", "Hovoríš: A teraz most k tomu, ako to celé obísť pri opakovanej práci. AI je brutálna v programovaní. (Klik.) V chate vám na rovnaký prompt, uprav mi dáta v Exceli, dá zakaždým iný postup a iný výstup. (Klik.) Ale keď si AI napíše kód a uloží ho, rovnaký kód dá zakaždým rovnaký výsledok. Deterministicky. Na to sú ChatGPT Work a Claude Cowork. (Klik.) Ja som tento rok nevytvoril ručne ani jeden Excel. Grafika: Tvoje slidy z Canvy Masterclass 3.0 intro, strany 55, 59, 60, 61, lekcia 40:20 až 42:40.", "Hovoríš: A teraz vodoznak, o ktorom sa veľa hovorí. Od augusta 2026 Claude v nových modeloch označuje texty, že ich napísala AI. Kvôli AI Actu to budú robiť aj ďalší. Veľa ľudí si myslí, že sú v texte skryté znaky alebo medzery. Nie sú. Pamätáte si ten zoznam slov so šancami? Často je tam viac slov, ktoré znamenajú to isté. Doteraz vybrala AI jedno náhodne. (Klik.) Teraz o výbere rozhoduje tajný kľúč: najznámejšie sa zmení na najslávnejšie, prvýkrát vydaná na vydaná. Pre vás je veta rovnaká, ľudia v testoch rozdiel nevideli. Ale kto má kľúč, v dlhšom texte ten vzor nájde. (Klik.) A kde AI na výber nemá, tam podpis nie je. Po Principia musí prísť Mathematica, inak by to bola chyba. Preto sa z jednej krátkej vety nedá spoľahlivo povedať, či ju písala AI, a keď si dáte opraviť len čiarky, vodoznaku je tam veľmi málo. Kompletne prepísaný text ho už nemá. Grafika: Tvoje slidy z Canvy Claude Watermark (strany 4, 8, 6, 10 na klik). Anthropic už má API na detekciu v súkromnom preview, veta detektor zatiaľ neexistuje už úplne neplatí.", "Hovoríš: NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). A neoznačujú sa len texty. Aj obrázky. (Klik.) Pri obrázkoch je to buď nepatrná zmena farby niektorých pixelov, ktorú okom nevidíte, ale stroj ju nájde, tak to robí Google cez SynthID. Alebo podpis v metadátach súboru, že vznikol cez AI. Claude takto od augusta 2026 označuje súbory, ktoré vytvorí, napríklad PNG, JPG alebo SVG, cez štandard C2PA. Ten istý používajú výrobcovia fotoaparátov. Čiže AI obrázok bez označenia bude čoraz zriedkavejší. Grafika: Jeden výrok, vysvetlenie na klik. Pixely: tvoje klubové video AI nástroje automaticky označujú vygenerovaný text (1:23 až 2:54). Claude a C2PA: článok Anthropic How Claude's text watermark works, časť What about images and other files (overené 22. 11. 2026). Nerobil som slide s príkladom obrázka, ak chceš ukážku, pošli obrázok.", "Hovoríš: NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Zhrniem to. (Klik.) Každý fakt si overte: zdroj, rozkliknúť, nájsť tú vetu. (Klik.) Pýtajte sa neutrálne. (Klik.) Na vaše dáta použite projekt alebo Gemini Notebook, ale aj tam kontrolujte. (Klik.) Na novú tému nový chat. (Klik.) A opakovanú prácu nech AI zapíše ako kód v ChatGPT Work alebo Claude Coworku. Grafika: Päť riadkov na klik podľa poradia tvojej hlasovky 22. 11. 2026.", "NOVÝ SLIDE (nemáš ho v starších prezentáciách, nauč sa ho). Hovoríš: Ak chcete ísť ďalej, v mojom klube Don't Die Busy Club vám ukazujem krok za krokom, ako s AI pracovať tak, aby vám reálne šetrila čas. Ako jej dať dobrý kontext, ako s ňou pracovať s vašimi dokumentmi bez halucinácií a ako si nastaviť opakované úlohy, aby ich robila zakaždým rovnako. Odkaz máte pod videom. A ak vám video pomohlo, dajte like a pošlite ho niekomu, kto AI používa ako Google. Grafika: Lime CTA s QR kódom na kamilaujesky.com/klub (vygenerovaný nanovo). Ponuku a cenu klubu som zámerne nedával, video je univerzálne a môže vyjsť kedykoľvek; Black Friday končí 30. 11. 2026. Popis pod videom podľa skillu kamil-youtube-prepisy (blok s odkazmi na klub, Instagram a web)."]};
const fr = document.getElementById('deck');
let idx = 0, slideEl = null, obs = null;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const n = D.notes[idx] || '';
  let hov = n, gra = '';
  const gi = n.indexOf(' Grafika');
  if (gi >= 0){ hov = n.slice(0, gi); gra = n.slice(gi + 1); }
  let tag = '';
  hov = hov.replace(/NOV(Ý|É) SLIDE[^)]*\)\.?|NOVÝ SLIDE V TOMTO VIDEU \([^)]*\)\.?/g, m => { tag = m.replace(/\.$/,''); return ''; });
  hov = hov.replace(/Hovoríš:\s*/g, '').trim();
  const parts = hov.split(/\(Klik\.\)/);
  const step = slideEl ? +(slideEl.dataset.step || 0) : 0;
  let x = tag ? '<div class="tag">' + esc(tag) + '</div>' : '';
  parts.forEach((p, i) => { x += '<p data-i="' + i + '" class="' + (i === step ? 'cur' : '') + '">' + (i ? '<span class="klik">KLIK ' + i + '</span>' : '') + esc(p.trim()) + '</p>'; });
  if (gra) x += '<details id="gra"><summary>Grafika a zdroje</summary>' + esc(gra) + '</details>';
  document.getElementById('notes').innerHTML = x;
  document.getElementById('num').textContent = 'SLIDE ' + (idx + 1) + ' / ' + D.labels.length + (parts.length > 1 ? '   ·   krok ' + step + ' / ' + (parts.length - 1) : '');
  document.getElementById('lab').textContent = D.labels[idx];
  document.getElementById('next').innerHTML = idx + 1 < D.labels.length ? 'Ďalší slide: <b>' + esc(D.labels[idx + 1]) + '</b>' : 'Posledný slide';
  const c = document.querySelector('#notes p.cur'); if (c) c.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
fr.addEventListener('load', () => {
  const doc = fr.contentDocument, ds = doc.querySelector('deck-stage');
  const slides = [...doc.querySelectorAll('deck-stage > section')];
  function bind(i){
    idx = i; slideEl = slides[i];
    if (obs) obs.disconnect();
    obs = new MutationObserver(render); obs.observe(slideEl, {attributes: true, attributeFilter: ['data-step']});
    render();
  }
  ds.addEventListener('slidechange', e => bind(e.detail.index));
  const a = slides.findIndex(s => s.hasAttribute('data-deck-active'));
  bind(a >= 0 ? a : 0);
  fr.contentWindow.focus();
});
// kláves v pravom paneli pošli do decku
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageDown','PageUp',' ','Home','End'].includes(e.key)){
    e.preventDefault(); fr.contentWindow.focus();
    const ev = new fr.contentWindow.KeyboardEvent('keydown', {key: e.key, code: e.code, bubbles: true, cancelable: true});
    fr.contentDocument.dispatchEvent(ev);
  }
});
