<script>
const D = {"labels": ["Titulka", "5 100 milionárov", "Šéf Nvidie odišiel", "Denník N", "Najhorší týždeň", "Poďme zistiť", "Čo je bublina", "Peniaze sú skutočné", "Tržby a náklady", "Strata na papieri", "Big Tech míňa", "Jadrová elektráreň", "Voľby: stopka pre dátové centrá?", "Kruh peňazí", "Dvaja zákazníci", "San Francisco", "Na čom stojí burza", "O koľko by to spadlo", "Kto to pocíti", "Čo hovoria ekonómovia", "Rok 2000", "4 signály", "Môj názor", "Zdražejú modely?", "Pointa", "Čo s tým", "Klub a Masterclass"], "notes": ["Hovoríš: Prvé sekundy, bez pozdravu, pokojne. Minulý štvrtok sa z jednej firmy stalo cez noc päťtisíc milionárov. Týždeň predtým odstúpil šéf Nvidie, firmy, na ktorej čipoch AI beží. A redaktor Denníka N sa v ten istý týždeň pýta, či AI bublina už nepraskla. Tak, praskla? Alebo letíme? Pozrieme sa na fakty a na to, čo hovoria ekonómovia. Na konci budeš vedieť sám spoznať podľa štyroch signálov, či praská. A poviem ti, čo si o tom myslím ja. Grafika: Titulka, na YouTube ju nahradí miniatúra. Úvod v3 stojí na ľuďoch (milionári, Huang, Hrivňák), nie na číslach firiem. Tri nasledujúce slidy sú tento úvod rozpísaný.", "Hovoríš: Anthropic, firma, ktorá robí Claude, išla minulý štvrtok na burzu. A z 5 300 ľudí, ktorí tam pracujú, má po tom dni asi 5 100 akcie za viac ako milión dolárov. 96 percent ľudí vo firme. Predstav si, že prídeš ráno do práce a skoro každý kolega v open space je milionár. Aj junior, ktorý prišiel pred dvoma rokmi, lebo kto prišiel skôr, dostal akcie oveľa lacnejšie. Rozhoduje, kedy si prišiel, nie aká si funkcia. (Klik.) 2 800 z nich má viac ako desať miliónov a asi 600 ľudí viac ako sto miliónov dolárov. (Klik.) Spolu by si za to podľa realitnej firmy Redfin mohli kúpiť skoro každý desiaty dom v celej oblasti San Francisca. (Klik.) Ale pozor, sú to akcie, nie peniaze na účte. Prvý deň mohli predať najviac desatinu. Grafika: Veľké číslo plus 3 odrážky na klik (3 kroky). Pôvod: Kamil (uhol milionárov, 22. 11.). Fakty: CNN 19. 11. 2026 podľa odhadu Hill.com pri cene 83 USD (5 100 nad 1 mil., 2 800 nad 10 mil., asi 600 nad 100 mil., skupiny sa prekrývajú; je to odhad, nie overený majetok). Kolegovia a junior: Andrew Benson, Hill, pre CNN: being early is more important than being senior. Redfin 9. 7. 2026, pred IPO: 63 mld. USD po dani súčasných aj bývalých zamestnancov voči 692 mld. USD hodnoty bývania v metropolitnej oblasti SF, teda asi 9 % hodnoty (Redfin to píše ako 9 % domov). Lockup: najviac 10 % akcií prvý deň (prospekt). Overil Cokel 22. 11. 2026.", "Hovoríš: A týždeň predtým odstúpil Jensen Huang, šéf Nvidie. Nvidia vyrába čipy, na ktorých AI beží, a on ju viedol 33 rokov. (Klik.) Odišiel zo dňa na deň, firma dôvod neuviedla. (Klik.) Tri dni predtým verejne napísal, že bol neverný svojej manželke. (Klik.) A americké úrady vyšetrujú singapurskú firmu Megaspeed, ktorá mala pašovať čipy Nvidie do Číny. Kongres si Huanga predvolá, aby vysvetlil, čo o tom Nvidia vedela. Prečo je to dôležité? Huanga brali ako hlavného vizionára a dohadzovača obchodov, ktorý ťahal celý rast AI. CNN píše, že po jeho odchode strach z bubliny zosilnel. A akcia Nvidie v ten deň spadla o viac ako 4 percentá. Grafika: Titulok plus 3 odrážky na klik (3 kroky). Pôvod: uhol z Hrivňákovho reelu (Kamil poslal), fakty Cokel. Rezignácia prijatá 11. 11. s okamžitou účinnosťou, oznámená 12. 11. (8-K), dočasná CEO Colette Kress. Huang 8. 11.: I was unfaithful to my wife (Alice Huang nemenoval). NEOVERENÉ a nehovor: že Huang pomáhal pašovať čipy, alebo že aféra bola dôvodom odchodu. Úrady nič také nekonštatovali. Väzba na bublinu: CNN live 19. 11. 2026 (Will Anthropic IPO calm bubble fears?): Those fears escalated following the exit of Nvidia CEO Jensen Huang, who was seen as the master visionary, engineer and dealmaker fueling much of the AI industry’s rise (overil Ken). Akcia NVDA 12. 11.: 166,19 USD oproti 173,73 USD deň predtým, minus 4,3 % (Nasdaq). Overil Cokel 22. 11. 2026.", "Hovoríš: A v ten istý týždeň napísal Tomáš Hrivňák v Denníku N článok s titulkom: AI bublina už možno praskla, len sme si to nevšimli, tvrdia komentátori. A na svojom Instagrame dodal, že ak niekedy boli dokonalé podmienky na prasknutie AI bubliny, tak je to teraz. A trh mu akoby dal za pravdu. Anthropic predal akcie investorom po 83 dolárov. Prvý deň na burze za ne ľudia platili 111. O deň neskôr na chvíľu už len 83 dolárov a 5 centov. Kto kúpil v prvý deň, bol zrazu o štvrtinu chudobnejší. Takže: praskla? Grafika: Citát titulku na cream. Článok overil Cokel (zoznam redakcie Denníka N, e.dennikn.sk/5703000, 19. 11. 2026, plný text za predplatným). Reel 21. 11. 2026 (tomihrivnak) prepísal Ken: Ak niekedy existovali dokonalé podmienky na to, aby praskla AI bublina, tak je to teraz. Je to jeho názor, cituj ho ako názor. Ceny ANT: emisná 83,00, otvorenie 19. 11. 111,50, minimum 20. 11. 83,05, záver 20. 11. 88,91 USD (Nasdaq, Cokel).", "Hovoríš: A celé sa to deje v týždni, keď burza zažila poriadny otras. Akcie za jeden týždeň prišli skoro o celý zisk z tohto roka. (Klik.) Technologický Nasdaq je za rok v mínuse a jeho sto najväčších firiem je 19 percent pod rekordom. (Klik.) Dve tretiny firiem v indexe S&P 500 sú aspoň o pätinu pod svojím maximom, v technológiách skoro deväť z desiatich. (Klik.) A S&P 500 klesal sedem dní za sebou. Naposledy tak dlho vo februári 2020, tesne pred covidom. (Klik.) Za päť dní stratili firmy v Nasdaqu na hodnote viac ako 4 bilióny dolárov. A samotná Nvidia takmer 900 miliárd. Toľko ešte nikdy žiadna firma za jeden týždeň nestratila. A prekonala tým vlastný rekord spred týždňa. Grafika: 3 odrážky na klik (3 kroky). Pôvod: Kamil (tento týždeň, 22. 11.). MarketWatch 21. 11. 2026: S&P 500 len plus 1 % za rok, Dow plus 0,2 %, Nasdaq minus 2,7 % (FactSet); Nasdaq-100 minus 0,9 % za rok, viac ako 19 % pod rekordom; 64 % členov S&P 500 aspoň 20 % pod rekordom, v IT 87 % (Dow Jones Market Data); VIX nad 30; IT sektor forward P/E 16,3, najnižšie od marca 2020 (FactSet). 24/7 Wall St.: S&P 500 v piatok minus 3,70 % na 6 910,39, siedma strata za sebou, najdlhšia séria od februára 2020. Kamilovo tvrdenie „vymazalo sa viac ako kedykoľvek predtým“ overil Cokel (research_cokel_v5.md): pre celý trh NEOVERENÉ, nehovor to o celej burze. Platí: Nasdaq Composite za 16. až 20. 11. viac ako 4 bilióny USD (WSJ), Nvidia za týždeň takmer 900 mld. USD, týždenný rekord jednej firmy, predošlý rekord jej vlastných 573 mld. USD z týždňa do 13. 11. (Dow Jones Market Data cez Yahoo Finance). Percentuálne to rekord S&P 500 nebol (4. 4. 2025 minus 9 %). Sumy indexov nesčítavaj.", "Hovoríš: Tak sa na to poďme pozrieť poriadne. Žiadne pocity, len fakty a to, čo hovoria ľudia, ktorí ekonómii rozumejú. Najprv, čo hovorí, že letíme. Potom všetko, čo hovorí, že to praskne. A na konci štyri signály, podľa ktorých to spoznáš sám, a môj názor. Grafika: Lime predel. Pôvod: Kamil (video stojí na faktoch a ekonómoch, 22. 11.).", "Hovoríš: Najprv, čo je vlastne bublina. Bublina je, keď cena niečoho rastie oveľa rýchlejšie ako peniaze, ktoré to reálne zarába. (Klik.) Ľudia kupujú, lebo vidia, že to rastie, a nechcú zmeškať vlak. Nie preto, že by firma zarábala. (Klik.) Bývalý minister financií Ivan Mikloš k tomu hovorí dôležitú vec: bubliny sú dobré a zlé. Zlé sú financované na dlh a nezostanú po nich žiadne inovácie. Dobré po sebe nechajú niečo, čo funguje ďalej. (Klik.) A AI je podľa neho kríženec oboch. Zapamätaj si to slovo: dlh. Vrátime sa k nemu. Grafika: Definícia plus Mikloš, 3 odrážky na klik (3 kroky). Pôvod: definícia AI (Ken), Mikloš je zdroj od ekonóma (Kamilov rámec videa). Zdroj: e.dennikn.sk/minuta/5641276 a článok e.dennikn.sk/5640491 (Kedy praskne AI bublina a čo to bude znamenať).", "Hovoríš: Najprv argumenty pre to, že letíme. A sú silné. V roku 2000 mali firmy často len webstránku a sľub. Dnes za AI firmy reálne platia. (Klik.) Nvidia minulý týždeň ukázala, že jej tržby z dátových centier za rok narástli o 110 percent, teda viac ako dvojnásobne. Aj bez Huanga. A tvoria 93 percent všetkého, čo predáva. Kedysi to bola firma na herné grafiky. (Klik.) Google Cloud narástol o 103 percent, na zhruba 28 miliárd eur za jeden štvrťrok. (Klik.) A Anthropic mal za tri mesiace tržby 15,4 miliardy eur. Toto nie sú lajky ani sľuby, to sú faktúry. Grafika: Tri štatistiky na klik (3 kroky). Pozor pri Google Cloud: suma zahŕňa aj služby mimo AI a firma má záujem dopyt zdôrazňovať. Nvidia Q3 FY2027: tržby 115,8 mld. USD (105,4 mld. €, plus 103 %), dátové centrá 107,6 mld. USD (plus 110 %, 92,9 %), výsledky 17. 11., teda po odchode Huanga. Overil Cokel.", "Hovoríš: Ale je tu druhá strana. Anthropic za tri mesiace predal za 15,4 miliardy eur. Prevádzka ho stála 15,9 miliardy, teda viac, ako zarobil. A len samotné počítače, na ktorých Claude beží, stáli asi 9 miliárd. Predstav si to ako kaviareň. Predáš kávu za 3 eurá. Len kávovar a elektrina na jednu šálku ťa stoja 1,75 eura. Z každej kávy ti ostane 1,25 eura a z toho musíš zaplatiť nájom a ľudí. A na konci štvrťroka si stále v mínuse. Grafika: Vodorovné pruhy plus prirovnanie ku káve. Pôvod: prirovnanie AI (Ken). Prospekt BaFin: tržby 16,956, prevádzkové náklady 17,523, z toho výpočty a infraštruktúra 9,863 mld. USD; pomer 58 % (výpočty) a 103 % (všetky prevádzkové náklady) prepočítaný na kávu za 3 € (1,75 € a 3,10 €). Opravené po diváckom teste: v3 vravela „čím viac predáš, tým viac počítaš“, čo z čísel nevyplýva. Prepočet 1,099 USD za 1 €.", "Hovoríš: Možno si videl titulky, že Anthropic za štvrťrok prerobil 21 miliárd eur. Takmer 20 miliárd z toho je len na papieri. (Klik.) Je to účtovné precenenie záväzkov voči investorom. Ako keď kamarátovi sľúbiš desať percent zo svojej firmy a firma zdražie. Tvoj sľub má zrazu vyššiu hodnotu a v účtovníctve to vyzerá ako strata, ale z peňaženky ti nič neodišlo. (Klik.) Skutočná strata z prevádzky bola asi pol miliardy. Pri bublinách si vždy over, či ide o hotovosť, alebo o čísla na papieri. Grafika: Lime odhalenie, 2 odrážky na klik (2 kroky), v4 zjednodušené po diváckom teste (stena miliárd). Pôvod: prirovnanie s kamarátom AI (Ken). Prospekt: čistá strata asi 21,2 mld. €, z toho asi 19,9 mld. € nepeňažné precenenie konvertibilných nástrojov a derivátových záväzkov. Prevádzková strata 567 mil. USD, asi 0,5 mld. €. Ocenenie pri plnom zriedení: 1,76 bilióna USD po prvom dni, asi 1,6 bilióna po piatku 20. 11. (Cokel, prospekt s. 26 krát cena na Nasdaq).", "Hovoríš: Lenže papier je jedna vec. Peniaze, ktoré naozaj odchádzajú, sú iná. A tých je obrovské množstvo. Google, Microsoft, Amazon a Meta minuli za jeden štvrťrok spolu 184 miliárd eur na budovy, servery a ďalší majetok. (Klik.) Nie všetko je AI, ale veľká časť áno. (Klik.) Len Google 46,8 miliardy. Dve tretiny na servery a siete, tretina na dátové centrá. (Klik.) A toto je jadro celej otázky o bubline. Nie či AI funguje. Ale či raz zarobí toľko, aby sa tieto peniaze vrátili. Grafika: Veľký výrok plus 3 odrážky na klik (3 kroky). Hotovostné nákupy hmotného majetku za kalendárny 3. štvrťrok 2026: Microsoft 39,4, Alphabet 51,4, Amazon 77,3, Meta 33,9 mld. USD, spolu 201,9 mld. USD (183,7 mld. €). Koľko presne na AI, firmy neuvádzajú (Cokel).", "Hovoríš: A nejde len o peniaze. Three Mile Island v Pensylvánii, miesto najznámejšej jadrovej nehody v Amerike z roku 1979. Blok, ktorý v roku 2019 zavreli, lebo sa neoplatil, teraz znova spúšťajú. (Klik.) Lebo Microsoft si z neho na 20 rokov dopredu zazmluvnil elektrinu pre svoje dátové centrá. (Klik.) A v Írsku už minulý rok spotrebovali dátové centrá 23 percent všetkej elektriny v krajine. Všetky domácnosti dokopy 28. (Klik.) Reaktor chcú spustiť v roku 2027. Ak AI nezarobí dosť, aby toto všetko zaplatila, niekto to zaplatí. Grafika: Titulok plus 3 odrážky na klik (3 kroky). Elektrina z Írska presunutá sem (v2 mala samostatný slide). Pozor: havária 1979 bola v druhom bloku, spúšťa sa prvý blok. Plán 2027 nie je garantovaný, podlieha povoleniam. Koľko z írskej spotreby je AI, úrad neuvádza. Fotka chladiacich veží do strihu.", "Hovoríš: A teraz politika, ktorú som videl na CNBC. Začiatkom novembra boli v Amerike voľby do Kongresu a demokrati drvivo vyhrali Snemovňu aj Senát. A mnohí z nich išli do volieb proti dátovým centrám. (Klik.) Senátor Bernie Sanders hneď po voľbách napísal: celoštátne moratórium na dátové centrá, hneď. (Klik.) Nová guvernérka Texasu v kampani sľúbila, že zastaví všetky povolenia pre dátové centrá. A v Texase je podľa Wells Fargo viac ako štvrtina plánovanej kapacity. (Klik.) Burza zareagovala okamžite. Vo štvrtok po voľbách Nvidia spadla o 9 percent, AMD o 17. A analytik Dan Ives teraz čaká, že rast investícií veľkých firiem do AI vyvrcholí už v roku 2027, nie až v 2028. Keď sa spomalí výstavba, spomalí sa aj to, z čoho dnes AI firmy žijú. Grafika: 3 odrážky na klik (3 kroky). Pôvod: Kamil (videl na CNBC, 22. 11.). CNBC 5. 11. 2026: Sanders na X National data center moratorium now; CNBC Voter Poll: 56 % voličov uviedlo AI a dátové centrá ako zásadný alebo hlavný faktor, z nich 65 % volilo demokratov; Gina Hinojosa (porazila Abbotta): I will issue a moratorium, a ban, on all data center approvals; Texas 27 % plánovanej kapacity (Wells Fargo). CNBC 6. 11. 2026 (The Tech Download): štvrtok Nvidia minus 9,3 %, AMD minus 17,3 %, CoreWeave minus 10 %; Dan Ives: Big Tech capex growth rate now peaks in 2027 vs our previous view 2028/2029; IDCA: od 1/2024 do 5/2026 aspoň 46 projektov za viac ako 170 mld. USD zablokovaných alebo odložených. Overil Ken v článkoch CNBC, Cokel overuje voľby. Úvod „ktorú som videl na CNBC“ sú tvoje slová.", "Hovoríš: Ale kto to celé drží? Bloomberg nakreslil graf, ktorý obletel svet. Nvidia v strede a okolo nej firmy, ktoré si navzájom posielajú peniaze. Nvidia dá 30 miliárd dolárov do OpenAI a OpenAI za ne kupuje čipy Nvidie. Microsoft dal OpenAI 13 miliárd a OpenAI sľúbilo kúpiť od Microsoftu cloud za 250 miliárd. Nvidia vlastní 7 percent CoreWeave, kupuje od nej výpočty za 6,3 miliardy a CoreWeave kupuje čipy Nvidie. A Anthropic? Polovicu tržieb mu v prvom polroku platili Amazon, Google a Microsoft, teda jeho vlastní investori. Ako keby pekár požičal kaviarni peniaze, aby od neho kúpila rožky, a potom sa chválil, ako mu rastú tržby. Bloomberg k tomu píše: keď AI nezarobí, firma, ktorá investovala, prehrá dvakrát. Zákazník prestane kupovať a jej podiel v ňom stratí hodnotu. Nie je to podvod. Ale keď jeden v kruhu prestane platiť, pocítia to všetci. Grafika: Vlastná replika grafu Bloombergu (šípky so sumami). V strihu ukáž originál: bloomberg.com/graphics/2026-ai-circular-deals (za predplatným, Kamil ho videl). Pôvod: Kamil (Nvidia graf, 22. 11.), pekár Ken. Fakty z Bloombergu (aktualizácia 27. 10. 2026, overil Ken): Microsoft do OpenAI viac ako 13 mld. USD; OpenAI kúpi cloud od Microsoftu za 250 mld. USD; Nvidia sľúbila až 100 mld. USD do OpenAI, nakoniec dala 30 mld. USD do kola; AMD: OpenAI môže byť jeden z najväčších akcionárov AMD; Nvidia 7 % CoreWeave a nákup cloudu za 6,3 mld. USD; Microsoft a Nvidia do Anthropicu spolu až 15 mld. USD; Amazon do OpenAI 15 mld. USD plus 35 mld. pri splnení podmienok; AMD do Anthropicu až 5 mld. USD; Amazon, Google a Microsoft tvorili 48 % tržieb Anthropicu v 1. polroku 2026 (prospekt). Company A loses twice (Bloomberg). AMD a OpenAI 160 mil. akcií (Staršie, 2025) a ECB box 3 v zálohe.", "Hovoríš: A čo keď niekto v tom reťazci stojí len na pár zákazníkoch? CoreWeave nerobí žiadny chatbot. Prenajíma obrovské počítače, na ktorých AI beží. A viac ako polovicu všetkých peňazí jej platia dvaja zákazníci. Jeden 30 percent, druhý 24. (Klik.) Predstav si firmu s dvoma klientmi, ktorí platia polovicu tržieb, a k tomu má hypotéku na stroje. CoreWeave má dlh takmer 43 miliárd eur. A to je presne tá zlá časť bubliny, o ktorej hovoril Mikloš: na dlh. Čo sa stane, keď jeden z tých dvoch povie, že už toľko nepotrebuje? Grafika: Dve veľké čísla, prirovnanie na klik (1 krok). Pôvod: prirovnanie AI (Ken). Dlh 46,873 mld. USD (42,7 mld. €) k 30. 9. 2026 zo súvahy v 10-Q, bez lízingových záväzkov. Mená zákazníkov 10-Q neuvádza; Microsoft a OpenAI NEOVERENÉ, nehovor ich ako fakt.", "Hovoríš: A teraz späť k tým milionárom. Bloomberg minulý týždeň natočil reportáž o San Franciscu. Ľudia z AI firiem majú akcie za milióny, ale nechcú ich predať. Tak si na ne berú úvery a kupujú domy. (Klik.) A tu je to dôležité: oni si požičiavajú peniaze, ktoré zaisťujú budúcimi peniazmi. Tými, ktoré im sľúbila valuácia. Nie sú reálne. (Klik.) Ak AI trh pôjde dole, pôjde dole aj hodnota ich peňazí. A drahé domy musia aj tak platiť, aj keď na to nebudú mať. (Klik.) A tie domy nie sú lacné: stredná cena bývania v San Franciscu je 1,66 milióna dolárov, o 19 percent viac ako pred rokom. Presne takto vyzerali bubliny v minulosti. Grafika: 3 odrážky na klik (3 kroky). Pôvod: odrážky 1 a 2 Kamil (22. 11., jeho slová v Hovoríš), odrážka 3 Cokel. Bloomberg Television 19. 11. 2026, Why San Francisco’s AI Boom is Unlike Anything Else, od 1:51. CNBC 19. 11.: brokeri hovoria o zamestnancoch, ktorí si môžu požičať oproti likvidnejším akciám. Redfin: medián všetkých typov bývania v meste SF 1 663 843 USD za 3 mesiace do októbra 2026, plus 18,8 %.", "Hovoríš: A teraz to, čo sa môže týkať priamo teba, aj keď nemáš ani jednu akciu Nvidie. (Klik.) Sedem firiem, Apple, Microsoft, Nvidia, Amazon, Google, Meta a Tesla, tvorí dnes skoro tretinu celej americkej burzy, presne 32 percent indexu S&P 500. (Klik.) A vo svetovom indexe MSCI World, ktorý kopíruje väčšina ETF na svetové akcie, je ich skoro štvrtina. (Klik.) A teraz pozor: slovenský dôchodkový fond Progres od Allianz podľa vlastnej správy kopíruje práve MSCI World. Takže ak si v ňom sporíš na dôchodok, si vlastne investor do tých istých siedmich firiem. A to isté platí pre množstvo ETF na svetové akcie. Grafika: 3 odrážky na klik (3 kroky). Pôvod: Kamil (nie som ekonóm, na S&P stojí všetko, chce Bloomberg, CNBC, CNN), fakty Cokel. IVV 20. 11. 2026: súčet 7 firiem 31,97 % (Apple 8,38, Microsoft 6,03, Nvidia 5,09, Amazon 4,06, Alphabet A 2,61 a C 2,10, Meta 2,07, Tesla 1,63). MSCI World 30. 10. 2026: USA 72,77 %, sedmička 23,68 %. Progres (Allianz DSS): najmenej 90 % majetku kopíruje MSCI World EUR (správa k 30. 10.). 23,68 % je váha indexu, nie zmeraná váha fondu ani celého druhého piliera. ECB (blog 17. 8. 2026): domácnosti eurozóny majú v amerických tech akciách asi 440 mld. €, významne aj poisťovne a dôchodkové fondy. Bez investičného odporúčania.", "Hovoríš: Tak o koľko by to mohlo spadnúť? (Klik.) Stratég Dario Perkins z TS Lombard si spravil scenár: veľké firmy v roku 2028 škrtnú plánované investície do AI o 45 percent. AI akcie by spadli o 40 percent, zvyšok trhu o 20 a celý S&P 500 asi o 30 percent. (Klik.) Goldman Sachs si spravil záťažový výpočet: ak sa zisky a ceny vrátia k dlhodobému priemeru, index spadne asi o štvrtinu. Pozor, to nie je ich hlavná predpoveď, tá je naopak rast. (Klik.) Čo to znamená v peniazoch? CNN to ukazuje na jednoduchom príklade: keby si mal 10 000 dolárov v indexovom fonde a ten spadne o 30 percent, ostane ti 7 000. (Klik.) A Bank of America sa v novembri pýtala správcov fondov. Viac ako polovica čaká, že do pol roka niekto z veľkých oznámi škrt investícií do AI. To je presne náš tretí signál. Grafika: 4 odrážky na klik (4 kroky). Sú to scenáre a odhady, nie zhoda bánk ani predpoveď. Perkins (TS Lombard, MarketWatch 26. 10.): fiktívny spätný pohľad z roku 2030, the S&P 500 was down about 30% from its peak; TS Lombard predáva analýzy. Goldman (Snider, 19. 11.): S&P 500 would decline by roughly 25% to a level of approximately 5,600, podmienený výpočet, hlavná prognóza plus 18 % do konca 2027. CNBC 19. 11.: Panmure Liberum (Klement) cieľ 5 000 bodov na koniec 2027 (v zálohe). CNN 21. 11. (Jon Ulin): fondy na S&P 500 a Nasdaq môžu držať tie isté firmy; príklad 10 000 na 7 000 je prepočet pri páde o 30 %. BofA november: 52 % správcov čaká capex škrt aspoň jedného hyperscalera do 6 mesiacov (Fortune 17. 11.), je to podiel respondentov, nie pravdepodobnosť pádu. Ilustrácia v zálohe: keby len 7 firiem spadlo o 30 %, MSCI World by bol nižšie asi o 7,1 % (prepočet Cokla).", "Hovoríš: A kto to teda pocíti? Nie je to jedna rana, je to reťaz. (Klik.) Prvý je sporiteľ. Dôchodok a ETF stratia hodnotu, aj keď si nič nekúpil ani nepredal. (Klik.) Potom obchody. Podľa odhadu Moody’s robí najbohatšia desatina Američanov skoro polovicu všetkých nákupov. A presne tí majú najviac akcií. Bloomberg upozorňuje, že ekonomika, ktorá stojí na nákupoch malej bohatej skupiny, je zraniteľnejšia. (Klik.) Potom stavbári. V scenári TS Lombard by v Amerike zaniklo asi pol milióna miest pri stavbe dátových centier a podobných budov. (Klik.) A nakoniec banky a fondy, ktoré na dátové centrá požičali. Keď nájomca neplatí, stratu nesie ten, kto drží dlh. (Klik.) Medzinárodný menový fond si to prepočítal: v zlom scenári by bola americká ekonomika v roku 2028 o 1,8 percenta menšia, ako by bola bez šoku, a svetová o 1,1. Ale svetovú recesiu z toho MMF nečaká. Grafika: 4 odrážky plus riadok MMF na klik (5 krokov). Zandi (Moody’s) cez USA TODAY 26. 9.: top 10 % podľa príjmu 45,5 % výdavkov v 1. štvrťroku 2026, je to modelový odhad (Minneapolis Fed upozorňuje, že prieskum domácností dáva 23 %, iná metóda). Bloomberg 17. 3. (Marte, Saraiva): An expansion relying on the shopping habits of a small, wealthy cohort is more vulnerable. Perkins: asi 500 000 miest v americkom nebytovom stavebníctve do polovice 2028, scenár. BIS Bulletin 140 (27. 10.): banky často požičiavajú projektovým spoločnostiam aj investorom, ktorí držia ich dlh. MMF (Reuters 13. 10., WEO október): HDP USA 2028 o 1,8 % a svet o 1,1 % nižší oproti základnej trajektórii, nie medziročný pokles; Petya Koeva Brooks: pravdepodobne nie svetová recesia. Fed (Barr 16. 11.) hovorí o tom istom efekte straty majetku na výdavky.", "Hovoríš: A čo na to ľudia, ktorí ekonómii rozumejú? Nezhodnú sa. (Klik.) Gary Gensler, bývalý šéf americkej Komisie pre cenné papiere, povedal pre CNN, že AI už je bublina a otázka je len, či príde mierna recesia, alebo niečo vážnejšie. Podľa neho do novembra 2028. Martin Wolf, hlavný ekonomický komentátor Financial Times, je opatrnejší: keď sa investície do AI prudko zastavia, môže to ekonomiku posunúť do recesie, ale kedy, nevie nikto. (Klik.) Na druhej strane Jason Furman z Harvardu, bývalý hlavný ekonomický poradca Bieleho domu: prasknutie AI bubliny by spomalilo rast, ale samo osebe by nespôsobilo recesiu. Prepočítal si to: keby akcie spadli o štvrtinu, ľudia by menej míňali a ekonomika by rástla asi o 0,6 percentuálneho bodu pomalšie. Do toho ale nepočíta straty bánk z nesplatených úverov. A u nás investor Roman Scherhaufer hovorí, že porovnávať to s hypotekárnou krízou je nelogické: vtedy boli v realitných produktoch zabalené riziká miliónov ľudí, dnes môže skrachovať len niekoľko IT firiem. A The Economist to zhrnul takto: pád akcií ako v roku 2000 je možný, hlboká finančná kríza je oveľa menej pravdepodobná. Takže na jednom sa zhodnú skoro všetci: burza to pocíti. Spor je o tom, či z toho bude recesia. Grafika: Dva stĺpce na klik (2 kroky): varovanie a upokojenie. Pôvod: Kamil chcel video postaviť na ekonómoch, výber hlasov Cokel a Ken. Gensler (CNN, edition.cnn.com/2026/11/16/economy/ai-bubble-anthropic-ipo-recession): It’s already a bubble; The only question is if it’s a soft recession or something more dramatic; repricing and softening of the economy before November 2028. Je to jeho prognóza, nie stanovisko SEC. Wolf (FT, podcast Behind the Money, 7. 1. 2026): which actually start tipping the economy into recession. The Economist (úvodník 12. 11. 2026): A dotcom-style equity-market crash could happen; a deep financial crisis is much less likely. Baláž (SAV, Denník E 21. 11.) v zálohe: najviac to zasiahne nové špekulatívne firmy. Furman (jasonfurmanecon.substack.com, 17. 11.): a bursting AI bubble would slow growth but would not, by itself, cause a recession; pri páde akcií o 25 % asi o 0,6 percentuálneho bodu slabší rast, bez úverových strát a škrtov investícií. Scherhaufer a Baláž: Denník E, anketa „ECB varuje pred AI bublinou“ (e.dennikn.sk/5703821, minúty 20. a 21. 11. 2026, overil Ken). Ani Furman netvrdí, že mimo burzy nikto nič nepocíti (Cokel). Navyše v zálohe: Stijn Van Nieuwerburgh (Columbia, Brookings 8. 10.): úvery na dátové centrá môžu niesť aj dôchodkové a dlhopisové fondy.", "Hovoríš: A toto sa už raz stalo. Rok 2000. Všetci vedeli, že internet zmení svet. A mali pravdu. Napriek tomu technologický index Nasdaq padol o 78 percent a na vrchol sa vrátil až po 15 rokoch. Amazon spadol o 95 percent, zo 113 dolárov na necelých 6. Cisco, ktoré bolo na chvíľu najdrahšou firmou sveta, o 90 percent. Pets.com, Webvan, eToys a stovky ďalších skončili. (Klik.) A internet? Ten vyhral. Áno, prasknutie prispelo k recesii v Amerike, ktorá trvala osem mesiacov, a v technologických odvetviach ubudlo za tri roky asi 1,2 milióna pracovných miest. Ale ľudí, ktorí používali internet, bolo v roku 2003 na svete skoro dvakrát viac ako v roku 2000. Zo 400 na 785 miliónov. Amazon, ten istý, čo stratil 95 percent, má dnes hodnotu asi 2,4 bilióna eur. Bublina praskla, technológia ostala. Grafika: Hlavné odhalenie pred signálmi a názorom (v3 presunuté z úvodu, aby neprezradilo pointu). Historické dáta zámerne. Nasdaq minus 77,9 %, nad vrchol až 23. 4. 2015; Amazon minus 94,7 % (ceny pred splitmi); Cisco minus 90,1 %; Amazon 20. 11. 2026 asi 2,67 bilióna USD (2,43 bilióna €). Overil Cokel. Recesia: NBER, marec až november 2001, 8 mesiacov; bublina prispela, nebola jedinou príčinou (aj 11. september). BLS: zamestnanosť v amerických high-tech odvetviach 13,5 mil. (2000) na 12,3 mil. (2003), čistý úbytok, nie počet prepustených. ITU: svet 400 mil. (2000) na 785 mil. (2003) používateľov internetu. Overil Cokel 22. 11. 2026.", "Hovoríš: Sľúbil som štyri signály. Tu sú. (Klik.) Prvý: tržby za AI prestanú rásť. Raz za štvrťrok si pozri, ako rastú dátové centrá Nvidie a Google Cloud. Kým rastú o desiatky percent, ľudia za AI platia. (Klik.) Druhý: veľký zákazník prestane platiť. Pamätáš si dvoch zákazníkov CoreWeave a kruh peňazí? Keď jeden vypadne, pocítia to všetci. (Klik.) Tretí: veľké firmy škrtnú investície. Kým Google, Microsoft, Amazon a Meta lejú do AI stovky miliárd, motor beží. (Klik.) A štvrtý, najľudskejší: keď ti o akciách AI začne rozprávať každý, aj ten, kto nikdy neinvestoval, a ľudia si na ne berú úvery. Tak vyzerá každý vrchol. (Klik.) A ako je to dnes? Tržby za AI rastú o desiatky percent, prvý signál nesvieti. Veľké firmy investície zatiaľ nekrátia, ale po voľbách analytici čakajú, že rast investícií vyvrcholí skôr. Tretí bliká. A úvery na akcie v San Franciscu už sú, štvrtý svieti. Druhý treba sledovať. Takže praskla? Podľa týchto signálov ešte nie. Ale dva už blikajú. Grafika: 4 riadky na klik plus riadok Dnes (5 krokov), v4 po diváckom teste: signály priložené k dnešku, odpoveď na otázku z úvodu. Stav: signál 1 Nvidia +110 % a Google Cloud +103 % (slide Peniaze sú skutočné), signál 3 184 mld. € za štvrťrok (slide Big Tech míňa), signál 4 Bloomberg SF (slide San Francisco); signál 2 bez zverejneného odchodu veľkého zákazníka, neoverované do hĺbky. Pôvod: zhrnutie signálov z faktov v decku (Ken), nie citát analytika. Bez investičného odporúčania.", "Hovoríš: Kamera na teba, tvoje slová (22. 11. 2026). Môj názor? AI je bublina a možno praskne. (Klik.) Ale nie som ekonóm. Čo sa môže stať, keď reálne praskne bublina, na ktorej dnes stojí celé S&P, netuším. (Klik.) Môj pocit je, že reálne to pocítia maximálne investori. (Klik.) Firmy a ľudia, aj keby sa stalo niečo zásadné, to podľa mňa nepocítia. Lebo čo sa môže stať najhoršie? Že sa spomalí rast a vývoj. (Klik.) Ale to, čo AI dokáže už teraz, to ti už nikto nevezme. [tvoj pohľad] Grafika: Veľký výrok plus 4 odrážky na klik (4 kroky), prvá odrážka v5 z tvojej správy 22. 11. Pôvod: Kamil, doslovne z _zdroj/kamil_vstupy.md. Fakty z decku, ktoré s tým súvisia (bez návrhu, ako to povedať): ETF a dôchodkové fondy s americkými akciami (slide Burza na pár firmách), Genslerova prognóza oslabenia ekonomiky do novembra 2028 a slovenskí ekonómovia (slide Čo hovoria ekonómovia).", "Hovoríš: A či tie modely zdražejú alebo nie? (Klik.) Možno hej. Ale aspoň to donúti ľudí a firmy využívať AI ako pracovný nástroj. (Klik.) Nie ako lepší Google. Lebo dnes ju tak používa väčšina: 83 percent ľudí na Slovensku, ktorí AI používajú, s ňou najmä hľadá informácie. Fakty k cenám: základné predplatné ChatGPT Plus aj Claude Pro dnes stojí 20 dolárov mesačne, ale pribudli drahšie tarify, pri ChatGPT až za 500 dolárov. A investor Bill Gurley hovorí, že peniaze investorov dnes AI dotujú. Grafika: Vľavo text na klik (2 kroky), vpravo tvoj slide 83 % (KROS slide 12, rovnaký ako vo Videu 03). Pôvod: Kamil (zdražejú, pracovný nástroj, nie lepší Google), prepojenie so slidom 83 % Ken. Zdroj 83 %: Median SK, MML TGI, 1. štvrťrok 2026, ľudia 14 až 79 rokov, ktorí AI používajú. Ceny (Cokel, stav 22. 11. 2026, USA, mesačne, bez DPH): ChatGPT Plus 20 USD, Pro 100, 200 a 500 USD (Pro 500 od 29. 9.); Claude Pro 20, Max 100, Ultra 200 USD. API: niektoré modely zlacneli (GPT-5.6 Luna o 80 % 30. 7.), novšie stoja viac (GPT-5.5 5/30 USD za milión tokenov oproti GPT-5.4 2,50/15). Gurley 23. 4. 2026: VC$$$ act as subsidies. Falk Brauer (RAInvent, má obchodný záujem) 5. 11.: poskytovatelia, ktorým dopyt prevyšuje ponuku, zvýšia ceny alebo sprísnia limity. Nikto nedokazuje, že po páde burzy automaticky zdražie základné predplatné.", "Hovoríš: Takže pointa celého videa. Bublina môže prasknúť. Akcie môžu spadnúť, niektoré firmy skončia. Ale to, čo AI dokáže už dnes, ti nikto nevezme. Presne ako v roku 2000: akcie padli, internet ostal a ľudí na ňom za tri roky pribudlo skoro dvakrát toľko. Grafika: Lime, hlavné odhalenie. Pôvod: Kamil (nikto nevezme), spojené s rokom 2000 (Ken).", "Hovoríš: Čo s tým ty? (Klik.) Nerob rozhodnutia podľa titulkov. Ani podľa toho, že to zajtra praskne, ani podľa toho, že na tom zbohatneš. Toto video nie je investičné odporúčanie. (Klik.) Používaj AI ako pracovný nástroj, nie ako lepší Google. Nie sa jej pýtaj, čo je ETF. Ale daj jej zmluvu a povedz: vytiahni mi z nej to podstatné, termíny a pokuty. (Klik.) A začni teraz. Keď bublina splasne, nástroje ostanú a náskok budú mať tí, čo ich už vedia používať. Grafika: 3 riadky na klik (3 kroky). Pôvod: bod 2 Kamil, body 1 a 3 Ken (z v2). Príklad so zmluvou je prompt 05 z tvojho lead magnetu 13 AI promptov do práce.", "Hovoríš: A ak sa chceš naučiť používať AI ako pracovný nástroj, bez ohľadu na to, čo robí burza, celý svoj systém ukazujem v Don't Die Busy Club aj v AI Masterclass. Odkaz je v popise. A napíš mi do komentára: je to podľa teba bublina, alebo letíme? Grafika: Tmavý closing, lime pilulka a QR na kamilaujesky.com/klub. Ceny klubu na slide zámerne nie sú."]};

function render(){
  const n = D.notes[idx] || '';
  let hov = n, gra = '';
  const gi = n.indexOf(' Grafika');
  if (gi >= 0){ hov = n.slice(0, gi); gra = n.slice(gi + 1); }
  let tag = '';
  hov = hov.replace(/NOV(Ý|É) SLIDE[^)]*\)\.?|NOVÝ SLIDE V TOMTO VIDEU \([^)]*\)\.?/g, m => { tag = m.replace(/\.$/,''); return ''; });
  hov = hov.replace(/Hovoríš:\s*/g, '').trim();
  const parts = hov.split(/\(Klik\.\)/);
  const step = slideEl ? +(slideEl.dataset.step || 0) : 0;
  let x = tag ? '<div class="tag">' + esc(tag) + '</div>' : '';
  parts.forEach((p, i) => { x += '<p data-i="' + i + '" class="' + (i === step ? 'cur' : '') + '">' + (i ? '<span class="klik">KLIK ' + i + '</span>' : '') + esc(p.trim()) + '</p>'; });
  if (gra) x += '<details id="gra"><summary>Grafika a zdroje</summary>' + esc(gra) + '</details>';
  document.getElementById('notes').innerHTML = x;
  document.getElementById('num').textContent = 'SLIDE ' + (idx + 1) + ' / ' + D.labels.length + (parts.length > 1 ? '   ·   krok ' + step + ' / ' + (parts.length - 1) : '');
  document.getElementById('lab').textContent = D.labels[idx];
  document.getElementById('next').innerHTML = idx + 1 < D.labels.length ? 'Ďalší slide: <b>' + esc(D.labels[idx + 1]) + '</b>' : 'Posledný slide';
  const c = document.querySelector('#notes p.cur'); if (c) c.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
fr.addEventListener('load', () => {
  const doc = fr.contentDocument, ds = doc.querySelector('deck-stage');
  const slides = [...doc.querySelectorAll('deck-stage > section')];
  function bind(i){
    idx = i; slideEl = slides[i];
    if (obs) obs.disconnect();
    obs = new MutationObserver(render); obs.observe(slideEl, {attributes: true, attributeFilter: ['data-step']});
    render();
  }
  ds.addEventListener('slidechange', e => bind(e.detail.index));
  const a = slides.findIndex(s => s.hasAttribute('data-deck-active'));
  bind(a >= 0 ? a : 0);
  fr.contentWindow.focus();
});
// kláves v pravom paneli pošli do decku
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageDown','PageUp',' ','Home','End'].includes(e.key)){
    e.preventDefault(); fr.contentWindow.focus();
    const ev = new fr.contentWindow.KeyboardEvent('keydown', {key: e.key, code: e.code, bubbles: true, cancelable: true});
    fr.contentDocument.dispatchEvent(ev);
  }
});
</script></body></html>
