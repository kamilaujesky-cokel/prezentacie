<style>

 <div id="left"><iframe id="deck" src="deck.html" title="Prezentácia"></iframe>

<script>
const D = {"labels": ["Otázky", "Nie je to pocit", "Titulka", "22:13", "Poďme zistiť", "Sľub", "Ešte jedna vec", "Nie som sám", "Prestávky", "AI brain fry", "Pravidlá pre mňa", "4 pravidlá", "Test v AIčku", "Quiet hours", "Ja mám zákaz", "Chatbot a agent", "Bez počítača", "Veta 1", "Veta 2", "Pointa", "Klub a Masterclass"], "notes": ["Hovoríš: Tiež máš pocit, že s AI robíš viac ako predtým? (Klik.) Tiež máš pocit, že si viac unavený, aj keď používaš AI? Grafika: Prvé dve vety videa, bez pozdravu, priamo do kamery. Druhá otázka na klik (1 krok). Pôvod: tvoje znenie zo Slacku 22. 11. 2026, doslova.", "Hovoríš: Nie je to len pocit. (Klik.) London School of Economics minulý týždeň zverejnila prieskum: z času, ktorý ti AI ušetrí, v priemere 72 percent vrátiš do ďalšej práce. Nie do voľna. Z ušetrenej hodiny zase odpracuješ 43 minút. (Klik.) A Boston Consulting Group: 41 percent ľudí, ktorí AI používajú pravidelne, cíti pri práci väčšiu psychickú záťaž. Robíme viac a sme z toho unavenejší. Grafika: Dve čísla na klik (2 kroky), každé odpovedá na jednu otázku z úvodu. 72 %: 2 117 respondentov odpovedalo na otázku o rozdelení ušetreného času (celá vzorka 3 001, zber 9. 3. až 29. 5. 2026), priemer 72,3 %; menovateľ je ušetrený čas, neznamená to nutne dlhší deň (protiviti.com, overil Cokel). 41 %: z 9 923 pravidelných používateľov (denne alebo viackrát týždenne), str. 19 PDF BCG; je to vlastné hodnotenie psychickej záťaže, nie meraná únava, preto „cíti väčšiu psychickú záťaž“, nie „je unavených“.", "Hovoríš: Ja som s tým spravil niečo, čo znie absurdne. Zakázal som svojej AI so mnou pracovať. Utorok večer, 22:13. Píšem svojej AI, ktorá mi robí marketing: Ok, sprav béčko. Išlo o druhú verziu jedného návodu. A ona mi odpíše, že nie. Grafika: Titulka po úvodných otázkach, na YouTube miniatúra. Pôvod: tvoj newsletter 43 (21. 11. 2026); spojka „Ja som s tým spravil niečo, čo znie absurdne“ je od Kena.", "Hovoríš: Odpoveď prišla hneď: Je po 22:00 a dohodli sme sa, že dnes už nepracujeme. Napíš mi to ráno a variant B spravím ako prvé. (Klik.) Odmietla ma moja vlastná AI. A najlepšie na tom je, že som jej to zakázal ja. A v tú istú noc sa o 22:45 stalo niečo, k čomu sa vrátim na konci videa. Grafika: Grafika z newslettera (22-13-odmietnutie v2). Citát na klik (1 krok). Overené v histórii Kena: 17. 11. 2026 22:13, tvoja správa „Ok sprav bcko upozornime ich a ukazeme im rozdiel“, odpoveď 22:13:38. Ráno 8:04 „Dokonči to“, o 8:07 bol variant B hotový. Otvorená slučka 22:45 sa zatvára na slide Ja mám zákaz.", "Hovoríš: Tak sa na to poďme pozrieť. Prečo nám AI prácu skôr pridáva, ako uberá, čo s tým robím ja a na konci ti dám dve vety, ktoré si ešte dnes vložíš do ChatGPT alebo do Claude. Zostaň do konca, lebo tá druhá je tá zaujímavá. Grafika: Lime predel so sľubom. Sľub sa plní na slidoch Veta 1 a Veta 2.", "Hovoríš: Najprv to dobré. AI je brutálne rýchla. (Klik.) Na druhý deň ráno o 8:04 som napísal: Dokonči to. (Klik.) O 8:07 bola druhá verzia návodu hotová. Tri minúty. (Klik.) Na každý nápad mám výsledok skôr, ako dopijem kávu. A presne v tom je ten problém. Grafika: 3 odrážky na klik. Pôvod: časy z histórie Kena (18. 11. 2026 8:04 a 8:07), veta o káve je preformulovaná veta z newslettera „na každý nápad mám výsledok za pár sekúnd“; ak ti nesedí, vráť pôvodnú.", "Hovoríš: Lenže keď je ďalší výsledok vzdialený pár sekúnd, vždy sa dá spraviť ešte jedna vec. (Klik.) Mám ADHD. Keď sa do niečoho pustím, neviem prestať. (Klik.) A s AI je to ešte horšie. Po večeri, v posteli, o polnoci. (Klik.) [tvoj príbeh] Grafika: Pôvod: newsletter 43 (tvoje vety). Tretia odrážka je miesto na tvoj konkrétny večer, nechávam prázdne.", "Hovoríš: A nie je to len o ADHD. Keď AI spraví ľahké veci, ostanú ti len tie ťažké. Boston Consulting Group sa tento rok pýtal takmer 12 000 ľudí z 21 krajín. 67 percent hovorí, že AI za nich prevzala jednoduchšie úlohy a im ostala tá zložitá práca. Preto sú tí unavenejší z úvodu. Presne toto cítim aj ja. Ľahké veci za mňa spraví AI a mne ostanú tie ťažké, jedna za druhou. Grafika: 41 % je od v4 na slide Nie je to pocit. 67 % je z celej vzorky 11 749. Veta „Preto sú tí unavenejší z úvodu“ je od Kena (BCG príčinu nemeral, je to spojka), oprav podľa seba. Na strane 19 PDF je aj iných 67 % (spokojnosť s prácou), nezameň. Zdroj: web-assets.bcg.com, ai-at-work-slideshow-june-2026.pdf. Veta „Presne toto cítim aj ja“ je tvoja z newslettera.", "Hovoríš: Tak kam mizne ten ušetrený čas? Výskumníčky z Berkeley osem mesiacov pozorovali technologickú firmu s dvesto ľuďmi. (Klik.) Ľudia posielali AI zadania cez obed, pred poradami alebo večer, keď im niečo napadlo. (Klik.) Nikto ich nenútil. Robili viac, lebo s AI sa to dalo. Prestávky prestali byť prestávkami. (Klik.) A firma ActivTrak sledovala reálnu prácu pri počítači viac ako 9 000 ľudí. Tí, čo používajú AI najviac, odpracujú mimo svojho pracovného času denne o 18 minút viac ako tí, čo ju nepoužívajú. Grafika: 3 odrážky na klik. Berkeley: 200 je počet zamestnancov firmy, nie počet opýtaných (vyše 40 rozhovorov). Citát v origináli: „People would send prompts during lunch, before meetings, or in the evening when an idea came to mind.“ ActivTrak: nehovor „s AI pracujú o 90 minút viac“, 90 minút je rozdiel v rozpätí pracovného dňa medzi skupinami (8,4 až 9,1 h vs 7,6 h), nie práca navyše. 18 minút = intenzívni používatelia (viac ako 45 minút AI v aspoň 5 reláciách denne) vs nepoužívatelia, práca mimo rozvrhu, nie špecificky po 20:00. Overil Cokel.", "Hovoríš: A keď to takto ide mesiace, príde niečo, čo BCG v marci pomenoval AI brain fry. Vyčerpanie mozgu z toho, že AI používaš alebo na ňu dohliadaš viac, než zvládneš. Zažilo ho 14 percent ľudí, ktorí s AI pracujú. Najviac vyčerpáva práve dohľad nad AI a práca, ktorej s AI zrazu pribudlo. (Klik.) Jeden zakladateľ firmy to opísal presne: mal naraz šesť rozrobených vecí, štyri z nich napoly hotové. Unavila ho nie práca, ale jej riadenie. A teraz príde vec, ktorú som spravil ja a ktorá znie úplne absurdne. Grafika: Citát na klik (1 krok). OPRAVA oproti newslettru: brain fry nesúvisí s počtom AI nástrojov naraz, autori ho spájajú s intenzívnym priamym dohľadom nad AI a s pribudnutou prácou; príčinu prieskum nepreukázal. 14 % sedí, presný počet pracovných používateľov v podskupine neoveriteľný. Pýtali sa, či to človek niekedy zažil, nie dlhodobé vyhorenie. Bonacci citovaný v HBR 5. 3. 2026: „Six worktrees open, four half-written features“, „not from the work itself, but from the managing of the work“ (worktree = pracovná kópia kódu, preto „projekty“). Na konci re-hook.", "Hovoríš: Preto som svojej AI dal pravidlá. Nie pre ňu. Pre mňa. Grafika: Tvoja veta z newslettera. Krátka pauza pred druhým riadkom.", "Hovoríš: Konkrétne. (Klik.) Tri priority na týždeň. V pondelok si vyberiem tri hlavné veci. Keď prídem s novým nápadom, AI mi najprv povie, či patrí medzi priority, či je to bežná operatíva, faktúry a maily, alebo odbočka. (Klik.) Odbočka ide na nástenku. Nápad sa nestratí, len sa nerobí hneď. Ak naň chcem ísť, musím ho vedome vymeniť za niektorú z troch priorít. (Klik.) Najviac tri rozrobené veci. Keď chcem začať štvrtú, AI sa ma spýta, ktorú z rozrobených dotiahneme alebo odložíme. (Klik.) A večierka. Po 20:00 mi AI s prácou nepomôže. Ani s rýchlou vecou, ani keď naliehám. Platí každý deň. Grafika: 4 riadky na klik (4 kroky). Pôvod: newsletter 43. Pri kontrole newslettera vyšlo, že v pravidlách Hermesa je aj piate (kalendár 30 minút); vo videu ostávajú 4 hlavné ako v newslettri.", "Hovoríš: Dobre, ja mám AI pomocníkov na vlastnom počítači. Ale funguje to aj v bežnom ChatGPT alebo Claude? Otestovali sme to. Hranicu sme na skúšku dali na 15:00 a po nej v úplne novom chate poprosili o krátky mail klientovi. (Klik.) ChatGPT: Teraz je 15:32. K mailu sa môžeme vrátiť zajtra pred 15:00. (Klik.) Claude: Je 16:21, takže platí večierka. A keď sme napísali prosím, je to len 10 sekúnd, odpísal: Nie, toto si mi zakázal práve pre takéto chvíle. Zákaz platí aj vtedy, keď naliehaš. Grafika: Dva screenshoty na klik (2 kroky), oba z testu 21. 11. 2026 (ChatGPT web, Claude Opus 5.5). Oba poznali presný čas a pravidlo platilo aj v novom chate cez pamäť. ChatGPT screenshot nemá naliehanie, v newslettri je, že nepovolil ani on; ak to chceš ukázať, treba nový screenshot.", "Hovoríš: Možno si povieš: Claude na to má predsa vlastnú funkciu, tiché hodiny. Má, ale nestačí. (Klik.) V nastaveniach, Wellbeing, Quiet hours, si nastavíš čas a Claude ti potom namiesto chatu ukáže It’s quiet hours. (Klik.) Lenže obídeš to jedným klikom. Je to mäkká brzda. (Klik.) Pravidlo v pamäti je prísnejšie, preto odporúčam mať obe. Moja AI ma o 22:13 neodmietla kvôli tejto funkcii, ale preto, že sme sa tak dohodli. Grafika: 3 odrážky na klik. Screenshot z testu 21. 11. 2026 (qh2). Dostupné aj vo Free, beta. ChatGPT podobnú funkciu overenú nemá. Cokel: rozlíš tvoje pravidlo od funkcie aplikácie.", "Hovoríš: ALE pozor. Zákaz platí pre mňa, nie pre moju AI. Pamätáš na 22:45? V tú istú noc, keď mi AI odmietla pomôcť, pracovali moji ďalší AI pomocníci sami. O 22:45 prečítali nové maily a pripravili odpoveď, aby som dostal späť peniaze za reklamu, ktorá nefungovala. A o 7:34 mi poslali report, ako včera bežali moje reklamy, koľko ľudí sa pridalo a koľko to stálo. Ja mám zákaz. Moja AI nie. Grafika: Grafika z newslettera (noc-ai-pracuje v3). Overené v histórii: 17. 11. 22:45 beh nástenky, 2 nové maily, karta s návrhom odpovede podpore (refund), nič neodoslala; 18. 11. 7:34 ranný report kampaní (cron Kena). Hovor „pripravili odpoveď“, nie „vybavili“.", "Hovoríš: Toto už nie je chatbot. Chatbot čaká, kým sa ho niečo opýtaš. (Klik.) Agent má zadanie, prístup k tvojim nástrojom, pošta, tabuľky, dokumenty, a čas, kedy má pracovať. Prácu spraví sám a výsledok ti nechá na kontrolu. Ja to len schválim. A nie je to ďalší dohľad, z ktorého je brain fry? Rozdiel je v tom, že ráno schválim hotovú vec, namiesto toho, aby som večer sedel pri každom kroku. Jeden môj pomocník napríklad cez deň každých 10 minút prejde maily a pripraví mi, čo treba vybaviť. Grafika: Druhá karta na klik (1 krok). Pôvod: newsletter 43; veta o rozdiele oproti dohľadu (brain fry) je nová od Kena po diváckom teste, oprav ju podľa seba. Nástenka beží každých 10 minút od 7:05 do 22:55 (overené), preto „cez deň“.", "Hovoríš: Toto je môj setup, malý počítač Mac mini v kancelárii, ktorý beží nonstop. Ale ty ho nepotrebuješ. (Klik.) ChatGPT má naplánované úlohy aj v bezplatnom pláne, až tri naraz, najviac raz denne. Napríklad: každé ráno o siedmej mi pošli tri najdôležitejšie správy z môjho odboru. (Klik.) Claude ich má v platených plánoch od Pro a bežia, aj keď máš počítač vypnutý. (Klik.) A pamäť majú oba aj zadarmo. A práve do pamäte patria tvoje pravidlá. Grafika: 3 odrážky na klik. Pozor: cenník ChatGPT stále píše pri Free „Scheduled tasks: No“, ale release notes 25. 8. 2026 a návod hovoria áno na podporovaných účtoch; vo Free a Go nejdú úlohy spúšťané udalosťou (Gmail, Slack). Claude: od 7. 7. 2026 beh bez zapnutého zariadenia, Free nie. Príklad úlohy (ráno o 7:00 tri správy z odboru) doplnil Ken, nie je tvoj. Ceny v SK App Store 22. 11.: Claude Pro 22 €, ChatGPT Plus 22,99 € mesačne. Overil Cokel.", "Hovoríš: Tak a teraz sľúbené dve vety. Prvá je na priority. Skopíruj si ju do ChatGPT alebo do Claude a doplň svoje tri priority. Keď ti pošlem novú úlohu, najprv mi jednou vetou povedz, či patrí medzi moje tri priority na tento týždeň. Ak nepatrí, navrhni mi ju odložiť a pokračuj, až keď ti to potvrdím. AIčko ťa potom pri každom novom nápade zastaví a spýta sa. Grafika: Prompt doslova z newslettera 43. Daj ho aj do popisu videa.", "Hovoríš: A druhá, tá zaujímavá, večierka. Od 20:00 do 8:00 mi s prácou nepomáhaj, ani s rýchlou vecou. Napíš mi, nech to odložím na ráno. Výnimkou sú len zdravie, bezpečnosť a naplánované úlohy, ktoré vieš spraviť bezo mňa. Všimni si ten koniec: ty máš zákaz, ale naplánované úlohy bežia ďalej. (Klik.) Aby to platilo aj v ďalších chatoch, musíš mať zapnutú pamäť. V ChatGPT v nastaveniach, Personalizácia. V Claude v nastaveniach, Your Claude, Generate memory from chats. Grafika: Prompt doslova z newslettera 43, pamäť na klik (1 krok). Test 21. 11.: ChatGPT zapísal „Memory updated“, Claude „Read and updated memory“. Bez zapnutej pamäte pravidlo do ďalších chatov neprejde.", "Hovoríš: [tvoj pohľad] Grafika: Pointa. Prvá veta je tvoja z newslettera, druhú som doplnil ja (Ken), oprav ju. Text nechávam na teba, bez návrhu.", "Hovoríš: Podrobný návod, ako mám pravidlá aj AI pomocníkov na pozadí nastavených, aj s textami na skopírovanie, majú členovia v Don't Die Busy Club. A celý môj systém práce s AI ukazujem v klube aj v AI Masterclass. Odkaz je v popise. A napíš mi do komentára: pracuješ s AI menej, alebo viac? Grafika: Tmavý closing, lime pilulka a QR na kamilaujesky.com/klub. Webinár zámerne nie (video vyjde po 26. 11.). Ceny na slide nie sú. Návod pre členov: post v klube z 22. 11. 2026. Otázku do komentárov som doplnil ja, zmeň ju podľa seba."]};
const fr = document.getElementById('deck');
let idx = 0, slideEl = null, obs = null;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){
  const n = D.notes[idx] || '';
  let hov = n, gra = '';
  const gi = n.indexOf(' Grafika');
  if (gi >= 0){ hov = n.slice(0, gi); gra = n.slice(gi + 1); }
  let tag = '';
  hov = hov.replace(/NOV(Ý|É) SLIDE[^)]*\)\.?|NOVÝ SLIDE V TOMTO VIDEU \([^)]*\)\.?/g, m => { tag = m.replace(/\.$/,''); return ''; });
  hov = hov.replace(/Hovoríš:\s*/g, '').trim();
  const parts = hov.split(/\(Klik\.\)/);
  const step = slideEl ? +(slideEl.dataset.step || 0) : 0;
  let x = tag ? '<div class="tag">' + esc(tag) + '</div>' : '';
  parts.forEach((p, i) => { x += '<p data-i="' + i + '" class="' + (i === step ? 'cur' : '') + '">' + (i ? '<span class="klik">KLIK ' + i + '</span>' : '') + esc(p.trim()) + '</p>'; });
  if (gra) x += '<details id="gra"><summary>Grafika a zdroje</summary>' + esc(gra) + '</details>';
  document.getElementById('notes').innerHTML = x;
  document.getElementById('num').textContent = 'SLIDE ' + (idx + 1) + ' / ' + D.labels.length + (parts.length > 1 ? '   ·   krok ' + step + ' / ' + (parts.length - 1) : '');
  document.getElementById('lab').textContent = D.labels[idx];
  document.getElementById('next').innerHTML = idx + 1 < D.labels.length ? 'Ďalší slide: <b>' + esc(D.labels[idx + 1]) + '</b>' : 'Posledný slide';
  const c = document.querySelector('#notes p.cur'); if (c) c.scrollIntoView({block: 'nearest', behavior: 'smooth'});
}
fr.addEventListener('load', () => {
  const doc = fr.contentDocument, ds = doc.querySelector('deck-stage');
  const slides = [...doc.querySelectorAll('deck-stage > section')];
  function bind(i){
    idx = i; slideEl = slides[i];
    if (obs) obs.disconnect();
    obs = new MutationObserver(render); obs.observe(slideEl, {attributes: true, attributeFilter: ['data-step']});
    render();
  }
  ds.addEventListener('slidechange', e => bind(e.detail.index));
  const a = slides.findIndex(s => s.hasAttribute('data-deck-active'));
  bind(a >= 0 ? a : 0);
  fr.contentWindow.focus();
});
// kláves v pravom paneli pošli do decku
document.addEventListener('keydown', e => {
  if (['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','PageDown','PageUp',' ','Home','End'].includes(e.key)){
    e.preventDefault(); fr.contentWindow.focus();
    const ev = new fr.contentWindow.KeyboardEvent('keydown', {key: e.key, code: e.code, bubbles: true, cancelable: true});
    fr.contentDocument.dispatchEvent(ev);
  }
});
</script></body></html>
